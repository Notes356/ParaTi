<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Eco IV : La Verdad (System Override)</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Orbitron:wght@500&display=swap" rel="stylesheet">

<style>
/* =========================================
   CORE STYLES - DARK MATTER UI
   ========================================= */
:root {
  --c-void: #020204;
  --c-gold: #ffd700;
  --c-cyan: #00f3ff;
  --c-plasma: #ff0055;
}

body, html {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background-color: var(--c-void);
  overflow: hidden;
  font-family: 'Press Start 2P', cursive;
  user-select: none; -webkit-tap-highlight-color: transparent;
  cursor: grab;
}
body:active { cursor: grabbing; }

/* CANVAS FULLSCREEN */
canvas { display: block; width: 100%; height: 100%; filter: contrast(1.2) brightness(1.1); }

/* UI LAYERS */
.scanlines {
  position: fixed; inset: 0; pointer-events: none; z-index: 50;
  background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
  background-size: 100% 4px;
  opacity: 0.6;
}
.vignette {
  position: fixed; inset: 0; pointer-events: none; z-index: 49;
  background: radial-gradient(circle, transparent 40%, #000 150%);
}

/* HUD REIMAGINADO */
#hud {
  position: fixed; top: 30px; width: 100%; 
  display: flex; flex-direction: column; align-items: center; 
  z-index: 60; pointer-events: none;
  mix-blend-mode: screen;
}

.sync-circle {
  width: 60px; height: 60px;
  border: 2px solid #333; border-radius: 50%;
  display: flex; justify-content: center; align-items: center;
  position: relative;
  background: rgba(0,0,0,0.5);
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

#sync-val {
  font-family: 'Orbitron', sans-serif; font-size: 14px; color: var(--c-cyan);
}

/* Anillo de progreso SVG */
.progress-ring__circle {
  transition: 0.1s stroke-dashoffset;
  transform: rotate(-90deg); transform-origin: 50% 50%;
  stroke: var(--c-cyan);
  filter: drop-shadow(0 0 5px var(--c-cyan));
}

.status-glitch {
  font-family: 'VT323'; font-size: 24px; color: rgba(255,255,255,0.7);
  margin-top: 10px; letter-spacing: 2px; text-transform: uppercase;
  text-shadow: 0 0 10px var(--c-cyan);
}

/* PANTALLA DE INICIO */
#start-screen {
  position: fixed; inset: 0; background: #000; z-index: 999;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  color: white; cursor: pointer;
  transition: opacity 0.8s;
}
.logo-glitch {
    font-size: 30px; color: var(--c-cyan); text-shadow: 2px 0 var(--c-plasma), -2px 0 yellow;
    animation: glitch-text 0.3s infinite;
}

/* ELLA - CONTENEDOR VIVO */
#ella-container {
    position: fixed; bottom: 12%; left: 50%; transform: translateX(-50%);
    width: 120px; height: 120px; z-index: 40; pointer-events: none;
    transition: transform 0.2s, filter 0.2s;
}

.bubble-glass {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.1), rgba(0, 243, 255, 0.05) 60%, rgba(0, 243, 255, 0.1));
    border: 1px solid rgba(0, 243, 255, 0.3);
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
    backdrop-filter: blur(2px);
    animation: breathe 4s ease-in-out infinite;
}

#ella-img {
    width: 70%; height: 70%; position: absolute; top: 15%; left: 15%;
    object-fit: contain; image-rendering: pixelated;
    filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.5));
}

/* ANIMACIONES */
@keyframes glitch-text {
  0% { transform: translate(0); }
  20% { transform: translate(-2px, 2px); }
  40% { transform: translate(-2px, -2px); }
  60% { transform: translate(2px, 2px); }
  80% { transform: translate(2px, -2px); }
  100% { transform: translate(0); }
}
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(0, 243, 255, 0.3); } }
@keyframes popIn { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

/* CAPA DE VICTORIA */
#victory-overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 100;
    display: flex; justify-content: center; align-items: center;
}
.word-final {
    font-size: 12vw; color: var(--c-gold);
    text-shadow: 0 0 50px var(--c-gold), 4px 4px 0px #000;
    opacity: 0; transform: scale(2);
    transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.word-final.show { opacity: 1; transform: scale(1); }

</style>
</head>
<body>

<div class="scanlines"></div>
<div class="vignette"></div>

<div id="start-screen">
  <div class="logo-glitch">ECO IV</div>
  <div style="font-family:'VT323'; font-size: 20px; color:#666; margin-top:10px;">PROTOCOL: TRUTH_SEEKER</div>
  <div style="margin-top: 40px; border: 1px solid var(--c-cyan); padding: 10px 20px; font-size: 10px;">[ INICIAR ]</div>
</div>

<div id="hud">
  <div class="sync-circle">
     <svg class="progress-ring" width="60" height="60">
       <circle class="progress-ring__circle" stroke="white" stroke-width="4" fill="transparent" r="26" cx="30" cy="30" style="stroke-dasharray: 163.36; stroke-dashoffset: 163.36;"/>
     </svg>
     <div id="sync-val" style="position:absolute;">0%</div>
  </div>
  <div class="status-glitch" id="status-text">DESINCRONIZADO</div>
</div>

<div id="victory-overlay">
    <div id="victory-word" class="word-final"></div>
</div>

<canvas id="game-canvas"></canvas>

<div id="ella-container">
    <div class="bubble-glass" id="ella-bubble"></div>
    <img id="ella-img" src="https://raw.githubusercontent.com/Notes356/NotasParsMIRO/b32ef0a23b35cffc8d5362ac0476cdb1bed418de/Fase4/Picsart_26-02-03_11-41-34-090.webp">
</div>

<audio id="bg-music" loop>
    <source src="https://raw.githubusercontent.com/Notes356/NotasParsMIRO/724f86883a7b62a6625dd5b97101102a70d50f18/Fase4/city-shadows-259186.ogg" type="audio/ogg">
</audio>

<script>
/**
 * =========================================================
 * MOTOR FÍSICO Y GRÁFICO "QUANTUM CORE"
 * Inercia, Aberración Cromática, Audio Procedural
 * =========================================================
 */
const Core = {
    cvs: document.getElementById('game-canvas'),
    ctx: null,
    width: 0, height: 0,
    
    // NIVELES
    levels: ["MIEDO", "RECUERDO", "SINCERIDAD"],
    echoes: ["Vacío", "Ruido", "Lejos", "Eco", "Luz", "Tú", "Yo"],
    lvlIdx: 0,
    
    // FÍSICA DE ROTACIÓN (INERCIA)
    rot: { x: 0, y: 0 },
    vel: { x: 0.5, y: 0.5 }, // Velocidad actual
    targetRot: { x: 150, y: 60 }, // Objetivo (0,0 es la solución relativa)
    dragging: false,
    lastMouse: { x: 0, y: 0 },
    
    // ESTADO DEL JUEGO
    locked: false,
    proximity: 0, // 0 a 1 (1 es resuelto)
    
    // OBJETOS
    stars: [],
    letters: [],
    particles: [], // Sistema de explosión
    
    // AUDIO
    audioCtx: null,
    droneOsc: null,
    droneGain: null,
    music: document.getElementById('bg-music'),

    init() {
        this.ctx = this.cvs.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        // Input Handling (Mouse & Touch con Inercia)
        this.setupInput();
        
        // Generar mundo
        this.createStars();
        this.loadLevel();
        
        // Loop
        requestAnimationFrame(() => this.loop());
    },
    
    setupInput() {
        const start = (x, y) => {
            if(this.locked) return;
            this.dragging = true;
            this.lastMouse = { x, y };
            this.vel = { x: 0, y: 0 }; // Parar inercia al tocar
        };
        
        const move = (x, y) => {
            if(!this.dragging || this.locked) return;
            const dx = x - this.lastMouse.x;
            const dy = y - this.lastMouse.y;
            
            // Aplicar velocidad directa
            this.vel.y = dx * 0.3;
            this.vel.x = dy * 0.3;
            
            this.rot.y += this.vel.y;
            this.rot.x += this.vel.x;
            
            this.lastMouse = { x, y };
        };
        
        const end = () => { this.dragging = false; };

        // Eventos
        window.addEventListener('mousedown', e => start(e.clientX, e.clientY));
        window.addEventListener('mousemove', e => move(e.clientX, e.clientY));
        window.addEventListener('mouseup', end);
        
        window.addEventListener('touchstart', e => start(e.touches[0].clientX, e.touches[0].clientY), {passive:false});
        window.addEventListener('touchmove', e => { e.preventDefault(); move(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
        window.addEventListener('touchend', end);
    },

    resize() {
        this.width = this.cvs.width = window.innerWidth;
        this.height = this.cvs.height = window.innerHeight;
        if(this.letters.length) this.placeLetters(this.levels[this.lvlIdx]);
    },
    
    // --- SISTEMA DE AUDIO PROCEDURAL (EL ZUMBIDO) ---
    initAudio() {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.audioCtx = new AC();
        this.music.volume = 0.4;
        this.music.play().catch(e => console.log(e));
        
        // Crear Drone (Oscilador que cambia con la proximidad)
        this.droneOsc = this.audioCtx.createOscillator();
        this.droneGain = this.audioCtx.createGain();
        
        this.droneOsc.type = 'sawtooth'; // Sonido "áspero" digital
        this.droneOsc.frequency.value = 50; // Bajo grave
        this.droneGain.gain.value = 0; // Silencio inicial
        
        // Filtro pasa-bajos para suavizar
        const filter = this.audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 200;
        
        this.droneOsc.connect(filter);
        filter.connect(this.droneGain);
        this.droneGain.connect(this.audioCtx.destination);
        this.droneOsc.start();
    },
    
    updateAudio(prox) {
        if(!this.audioCtx) return;
        
        // A mayor proximidad, mayor volumen y mayor tono (Pitch)
        // Crea tensión auditiva
        const baseFreq = 60;
        const targetFreq = baseFreq + (prox * 200); // Sube hasta 260Hz
        
        // Suavizar transición de audio
        this.droneOsc.frequency.setTargetAtTime(targetFreq, this.audioCtx.currentTime, 0.1);
        
        // Volumen: Solo suena si te mueves o estás cerca
        let targetVol = (Math.abs(this.vel.x) + Math.abs(this.vel.y)) * 0.1; 
        if(prox > 0.7) targetVol += (prox - 0.7); // Sube volumen al final
        
        this.droneGain.gain.setTargetAtTime(Math.min(0.2, targetVol), this.audioCtx.currentTime, 0.1);
    },

    playWinSound() {
        if(!this.audioCtx) return;
        const o = this.audioCtx.createOscillator();
        const g = this.audioCtx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(440, this.audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(880, this.audioCtx.currentTime + 0.1);
        g.gain.setValueAtTime(0.5, this.audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 1);
        o.connect(g); g.connect(this.audioCtx.destination);
        o.start(); o.stop(this.audioCtx.currentTime + 1);
    },

    // --- GENERACIÓN DE MUNDO ---
    createStars() {
        this.stars = [];
        for(let i=0; i<400; i++) {
            const isEcho = Math.random() < 0.1;
            this.stars.push({
                x: (Math.random()-0.5) * 2500,
                y: (Math.random()-0.5) * 2500,
                z: (Math.random()-0.5) * 2500,
                txt: isEcho ? this.echoes[Math.floor(Math.random()*this.echoes.length)] : null,
                sz: Math.random() * 2
            });
        }
    },

    loadLevel() {
        const word = this.levels[this.lvlIdx];
        this.placeLetters(word);
        
        // Aleatorizar rotación inicial (lejos del 0,0)
        this.rot.x = Math.random() > 0.5 ? 120 : -120;
        this.rot.y = Math.random() > 0.5 ? 120 : -120;
        this.vel = { x: 1, y: 1 }; // Impulso inicial
        
        this.locked = false;
        this.updateHUD(0);
        document.getElementById('status-text').innerText = "BUSCANDO: " + "_ ".repeat(word.length);
        document.getElementById('victory-word').classList.remove('show');
    },

    placeLetters(word) {
        this.letters = [];
        const spacing = Math.min(60, (this.width * 0.8) / word.length);
        
        for(let i=0; i<word.length; i++) {
            const xOff = (i - (word.length-1)/2) * spacing;
            this.letters.push({
                char: word[i],
                // Target (La solución plana)
                tx: xOff, ty: 0, tz: 0,
                // Base (El desorden 3D)
                bx: xOff + (Math.random()-0.5)*800,
                by: (Math.random()-0.5)*800,
                bz: (Math.random()-0.5)*800,
                
                curr: {x:0, y:0, z:0} // Posición actual calculada
            });
        }
    },

    // --- LOOP PRINCIPAL (RENDER + LÓGICA) ---
    loop() {
        // 1. FÍSICA DE INERCIA (Si no arrastras, sigue girando un poco)
        if(!this.dragging && !this.locked) {
            this.rot.x += this.vel.x;
            this.rot.y += this.vel.y;
            this.vel.x *= 0.95; // Fricción
            this.vel.y *= 0.95;
        }

        // 2. CÁLCULO DE PROXIMIDAD (MATH)
        // Normalizar ángulos a -180 / 180
        let ex = this.rot.x % 360; if(ex>180) ex-=360; if(ex<-180) ex+=360;
        let ey = this.rot.y % 360; if(ey>180) ey-=360; if(ey<-180) ey+=360;
        
        const dist = Math.sqrt(ex*ex + ey*ey);
        // Factor 0 a 1. (Radio de acierto: 90 grados)
        this.proximity = Math.max(0, 1 - (dist / 90)); 
        
        // Actualizar Audio y HUD
        this.updateAudio(this.proximity);
        this.updateHUD(this.proximity);

        // 3. RENDER (EFECTO CRT + LIMPIEZA)
        // Truco: No borramos todo al 100%, dejamos estela (trail) si hay movimiento rápido
        this.ctx.fillStyle = `rgba(2, 2, 4, ${this.locked ? 0.1 : 0.6})`;
        this.ctx.fillRect(0, 0, this.width, this.height);
        
        const cx = this.width/2;
        const cy = this.height/2;

        // EFECTO ABERRACIÓN CROMÁTICA (RGB SPLIT)
        // Si hay velocidad alta o mucha proximidad, desfasamos colores
        const shake = (Math.abs(this.vel.x) + Math.abs(this.vel.y)) * 2 + (this.proximity > 0.8 ? (Math.random()*4) : 0);
        
        this.ctx.save();
        
        // DIBUJAR ESTRELLAS
        this.stars.forEach(s => {
            // Parallax sutil basado en rotación
            const px = this.project(s.x, s.y, s.z, this.rot.x*0.1, this.rot.y*0.1);
            if(px.s > 0) {
                this.ctx.globalAlpha = 0.4 + (this.proximity * 0.4);
                
                if(s.txt) {
                    // Texto Eco
                    this.ctx.font = `${10 * px.s}px 'VT323'`;
                    this.ctx.fillStyle = this.proximity > 0.8 ? "white" : "#444";
                    this.ctx.fillText(s.txt, cx + px.x, cy + px.y);
                } else {
                    // Punto
                    this.ctx.fillStyle = "white";
                    this.ctx.fillRect(cx + px.x, cy + px.y, s.sz*px.s, s.sz*px.s);
                }
            }
        });

        // DIBUJAR LETRAS (EL NÚCLEO)
        this.letters.forEach(l => {
            // Interpolación: Si prox es 1, usa Target. Si es 0, usa Base.
            // Usamos una curva cúbica para que se sienta magnético al final
            const t = this.proximity * this.proximity * this.proximity;
            
            l.curr.x = l.bx * (1-t) + l.tx * t;
            l.curr.y = l.by * (1-t) + l.ty * t;
            l.curr.z = l.bz * (1-t) + l.tz * t;
            
            // Proyecto principal (WHITE channel)
            const p = this.project(l.curr.x, l.curr.y, l.curr.z, this.rot.x, this.rot.y);
            
            if(p.s > 0) {
                const size = (20 + (40 * this.proximity)) * p.s;
                this.ctx.font = `${size}px 'Press Start 2P'`;
                this.ctx.textAlign = "center";
                this.ctx.textBaseline = "middle";

                // EFECTO RGB SPLIT (GLITCH)
                if(shake > 1) {
                    // Canal Rojo
                    this.ctx.fillStyle = "rgba(255,0,0,0.7)";
                    this.ctx.fillText(l.char, cx + p.x + shake, cy + p.y);
                    // Canal Azul
                    this.ctx.fillStyle = "rgba(0,255,255,0.7)";
                    this.ctx.fillText(l.char, cx + p.x - shake, cy + p.y);
                }
                
                // Canal Principal (Blanco/Dorado)
                if(this.proximity > 0.95) {
                    this.ctx.fillStyle = "#ffd700";
                    this.ctx.shadowBlur = 20; this.ctx.shadowColor = "orange";
                } else {
                    this.ctx.fillStyle = `rgba(0, 243, 255, ${0.4 + this.proximity})`;
                    this.ctx.shadowBlur = 0;
                }
                
                this.ctx.fillText(l.char, cx + p.x, cy + p.y);
                this.ctx.shadowBlur = 0;
            }
        });
        
        this.ctx.restore();

        // 4. SISTEMA DE PARTÍCULAS (EXPLOSIÓN)
        this.updateParticles();

        // 5. CHECK WIN
        if(!this.locked && this.proximity > 0.98) {
            this.triggerWin();
        }

        requestAnimationFrame(() => this.loop());
    },

    // Matemáticas 3D
    project(x, y, z, rx, ry) {
        const radX = rx * 0.01745;
        const radY = ry * 0.01745;
        
        // Rot Y
        const x1 = x * Math.cos(radY) - z * Math.sin(radY);
        const z1 = x * Math.sin(radY) + z * Math.cos(radY);
        // Rot X
        const y2 = y * Math.cos(radX) - z1 * Math.sin(radX);
        const z2 = y * Math.sin(radX) + z1 * Math.cos(radX);
        
        const scale = 600 / (600 + z2);
        return { x: x1*scale, y: y2*scale, s: scale };
    },

    // --- MANEJO DE PARTÍCULAS ---
    spawnExplosion() {
        // Crear partículas desde el centro de la pantalla
        for(let i=0; i<100; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 10 + 2;
            this.particles.push({
                x: this.width/2, y: this.height/2,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1.0,
                color: Math.random() > 0.5 ? '#ffd700' : '#00f3ff'
            });
        }
    },

    updateParticles() {
        for(let i=this.particles.length-1; i>=0; i--) {
            const p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2; // Gravedad
            p.life -= 0.02;
            
            if(p.life <= 0) {
                this.particles.splice(i, 1);
            } else {
                this.ctx.globalAlpha = p.life;
                this.ctx.fillStyle = p.color;
                this.ctx.fillRect(p.x, p.y, 4, 4);
            }
        }
        this.ctx.globalAlpha = 1;
    },

    // --- UI & FEEDBACK ---
    updateHUD(prox) {
        const pct = Math.floor(prox * 100);
        document.getElementById('sync-val').innerText = pct + '%';
        
        // Anillo SVG
        const circle = document.querySelector('.progress-ring__circle');
        const radius = circle.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;
        const offset = circumference - (prox * circumference);
        circle.style.strokeDashoffset = offset;
        
        // Colores y Ella
        const ellaBubble = document.getElementById('ella-bubble');
        if(prox > 0.9) {
            circle.style.stroke = "var(--c-gold)";
            document.getElementById('sync-val').style.color = "var(--c-gold)";
            ellaBubble.style.borderColor = "var(--c-gold)";
            ellaBubble.style.boxShadow = "0 0 30px var(--c-gold)";
        } else {
            circle.style.stroke = "var(--c-cyan)";
            document.getElementById('sync-val').style.color = "var(--c-cyan)";
            ellaBubble.style.borderColor = "var(--c-cyan)";
            ellaBubble.style.boxShadow = "0 0 20px rgba(0,243,255,0.1)";
        }
    },

    triggerWin() {
        this.locked = true;
        this.playWinSound();
        this.spawnExplosion();
        
        // Feedback visual fuerte
        document.body.style.filter = "invert(1)";
        setTimeout(() => document.body.style.filter = "invert(0)", 100);

        const word = this.levels[this.lvlIdx];
        
        // UI Victoria
        const vWord = document.getElementById('victory-word');
        vWord.innerText = word;
        vWord.classList.add('show');
        
        document.getElementById('status-text').innerText = "SINCRONIZADO";
        document.getElementById('status-text').style.color = "var(--c-gold)";
        
        // Ella celebra
        const ella = document.getElementById('ella-container');
        ella.style.transform = "translate(-50%, -50px) scale(1.2)";
        
        setTimeout(() => {
            vWord.classList.remove('show');
            ella.style.transform = "translate(-50%, 0) scale(1)";
            
            if(this.lvlIdx < this.levels.length - 1) {
                this.lvlIdx++;
                this.loadLevel();
            } else {
                this.endGame();
            }
        }, 3000);
    },

    endGame() {
        // Transición final
        document.body.style.transition = "opacity 2s";
        document.body.style.opacity = 0;
        setTimeout(() => {
             // window.location.href = 'fase5_acto2.html';
             window.location.href = 'fase5html2.html';
        }, 2000);
    }
};

// --- ARRANQUE ---
document.getElementById('start-screen').addEventListener('click', function() {
    this.style.opacity = '0';
    setTimeout(() => this.remove(), 800);
    Core.init();
    Core.initAudio();
});

</script>
<script type="module">
  import { registrarPaso } from './telemetry.js';
  registrarPaso("Eco IV: La Verdad (System Override)");
</script>
</body>
</html>
