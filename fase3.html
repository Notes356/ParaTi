<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a15">
    <title>Eco II : Sincronización de Recuerdos</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        /* =============================================================================
           1.0 NÚCLEO VISUAL & VARIABLES DE ENTORNO
           ============================================================================= */
        :root {
            --c-void: #050510;
            --c-holo: #00f3ff; /* Cian Holográfico */
            --c-warn: #ff0055; /* Rojo Alerta */
            --c-gold: #ffd700; /* Oro Memoria */
            --c-grid: rgba(0, 243, 255, 0.05);
            
            --scan-speed: 2s;
            --crt-flicker: 0.02;
        }

        * { box-sizing: border-box; cursor: none; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: var(--c-void);
            font-family: 'VT323', monospace; user-select: none;
        }

        /* =============================================================================
           2.0 CAPAS DE RENDERIZADO (BACKEND VISUAL)
           ============================================================================= */
        
        /* 2.1 FONDO PARALLAX */
        #layer-world {
            position: fixed; top: -5%; left: -5%; width: 110%; height: 110%;
            background-image: url('https://raw.githubusercontent.com/Notes356/NotasParsMIRO/8708091f749f048e765d3bfcbcb8f201e7515a45/5718aa808e8431bed2f5b39795ed448c.jpg');
            background-size: cover; background-position: center;
            z-index: 0;
            filter: brightness(0.4) contrast(1.2) sepia(0.3);
            transition: transform 0.1s linear; /* Smooth parallax */
            will-change: transform;
        }

        /* 2.2 NIEBLA VOLUMÉTRICA */
        .fog-stream {
            position: fixed; top: 0; left: 0; width: 200vw; height: 100vh;
            background: url('https://raw.githubusercontent.com/Notes356/NotasParsMIRO/main/fog-texture-opt.png'), /* Fallback o textura generada */
                        linear-gradient(90deg, transparent 0%, rgba(0, 243, 255, 0.05) 50%, transparent 100%);
            z-index: 1; pointer-events: none; opacity: 0.3;
            animation: drift 60s linear infinite;
        }
        @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        /* 2.3 INTERFERENCIA CRT */
        .crt-scanlines {
            position: fixed; inset: 0; pointer-events: none; z-index: 100;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                        linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06));
            background-size: 100% 4px, 6px 100%;
        }

        /* 2.4 CANVAS DE PARTÍCULAS */
        #dust-canvas {
            position: fixed; inset: 0; z-index: 2; pointer-events: none;
        }

        /* =============================================================================
           3.0 AVATARES & REACCIONES (ENTITY SYSTEM)
           ============================================================================= */
        #entity-layer {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
        }

        .avatar-unit {
            position: absolute; bottom: 5vh; 
            display: flex; flex-direction: column; align-items: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #unit-ella { left: 10%; width: 100px; }
        #unit-yo { right: 10%; width: 100px; }

        .pixel-sprite {
            width: 100%; height: auto; image-rendering: pixelated;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
            animation: levitate 4s ease-in-out infinite;
        }
        #unit-yo .pixel-sprite { animation-delay: 2s; }

        @keyframes levitate { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        /* Emotes Flotantes */
        .emote-popup {
            position: absolute; top: -50px; left: 50%; transform: translateX(-50%);
            font-size: 24px; color: #fff; text-shadow: 0 0 10px var(--c-holo);
            animation: emoteFloat 1.5s forwards;
        }
        @keyframes emoteFloat {
            0% { opacity: 0; transform: translate(-50%, 10px) scale(0); }
            20% { opacity: 1; transform: translate(-50%, 0) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -30px) scale(1); }
        }

        /* =============================================================================
           4.0 TECNOLOGÍA DE ESCÁNER (RADAR SYSTEM)
           ============================================================================= */
        #scanner-hud {
            position: fixed; top: 0; left: 0; width: 100px; height: 100px;
            margin: -50px 0 0 -50px; /* Centrado */
            border-radius: 50%;
            border: 1px dashed rgba(255,255,255,0.3);
            pointer-events: none; z-index: 50;
            display: flex; justify-content: center; align-items: center;
            will-change: transform;
            mix-blend-mode: screen;
        }

        /* Anillos de radar */
        #scanner-hud::before {
            content: ''; position: absolute; inset: -10px; border-radius: 50%;
            border: 2px solid var(--c-holo);
            border-left-color: transparent; border-right-color: transparent;
            animation: spin 4s linear infinite; opacity: 0.5;
        }
        #scanner-hud::after {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0%, var(--c-holo) 10%, transparent 40%);
            animation: radarSweep 2s linear infinite;
            opacity: 0.3;
        }

        #scanner-hud.locking {
            border-color: #fff;
            animation: lockOn 0.2s infinite;
        }
        #scanner-hud.locking::after { background: var(--c-gold); opacity: 0.6; }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes radarSweep { 100% { transform: rotate(360deg); } }
        @keyframes lockOn { 0% { box-shadow: 0 0 10px var(--c-gold); } 100% { box-shadow: 0 0 25px var(--c-gold), inset 0 0 15px var(--c-gold); } }

        /* Puntos de interés invisibles (Detectores) */
        .memory-node {
            position: absolute; width: 100px; height: 100px; 
            border-radius: 50%; z-index: 20; transform: translate(-50%, -50%);
            /* border: 1px solid red; Debug only */
        }

        /* =============================================================================
           5.0 INTERFAZ DE DATOS (TERMINAL & MODALS)
           ============================================================================= */
        
        /* Terminal Holográfica */
        #holo-terminal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            width: 90%; max-width: 600px;
            background: rgba(10, 15, 20, 0.95);
            border: 1px solid var(--c-holo);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.15), inset 0 0 100px rgba(0,0,0,0.8);
            padding: 2px; /* Frame gap */
            z-index: 200; opacity: 0; pointer-events: none;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            
            /* Efecto Glitch Clip Path */
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }
        #holo-terminal.active { 
            opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; 
            clip-path: polygon(0 10%, 5% 0, 95% 0, 100% 10%, 100% 90%, 95% 100%, 5% 100%, 0 90%);
        }

        .terminal-inner {
            border: 1px solid rgba(0,243,255,0.3); padding: 20px;
            background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0, 243, 255, 0.02) 3px);
        }

        .term-header {
            display: flex; justify-content: space-between; border-bottom: 2px solid var(--c-holo);
            padding-bottom: 5px; margin-bottom: 15px; font-family: 'Press Start 2P'; font-size: 10px; color: var(--c-holo);
        }

        .term-visual {
            width: 100%; height: 250px; background: #000; border: 1px solid #333; margin-bottom: 15px;
            display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative;
        }
        .term-visual img { max-width: 100%; max-height: 100%; display: none; filter: sepia(0.2) contrast(1.2); }
        .term-visual::after { /* Brillo pantalla */
            content: ''; position: absolute; inset:0; background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.8) 100%); pointer-events: none;
        }

        #term-content {
            font-size: 1.4rem; line-height: 1.5; color: #a8e6cf; min-height: 80px;
            white-space: pre-wrap; text-shadow: 0 0 5px rgba(168, 230, 207, 0.4);
        }

        .btn-save {
            width: 100%; background: transparent; border: 2px solid var(--c-holo); color: var(--c-holo);
            padding: 15px; margin-top: 15px; font-family: 'Press Start 2P'; font-size: 11px;
            cursor: none; text-transform: uppercase; transition: 0.3s;
        }
        .btn-save:hover { background: var(--c-holo); color: #000; box-shadow: 0 0 20px var(--c-holo); }

        /* Video Feed (Estilo Monitor Seguridad) */
        #video-feed {
            position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 300;
            display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.5s;
        }
        #video-feed.active { opacity: 1; pointer-events: auto; }
        
        .monitor-frame {
            border: 10px solid #222; border-radius: 10px; padding: 5px; background: #111;
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.2);
        }
        video { display: block; max-width: 90vw; max-height: 70vh; border: 1px solid #333; }

        /* =============================================================================
           6.0 HUD GLOBAL (BARRA DE ESTADO)
           ============================================================================= */
        #status-bar {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; z-index: 150;
            background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 50px;
            border: 1px solid #333; backdrop-filter: blur(4px);
        }
        .sync-node {
            width: 10px; height: 10px; border-radius: 50%; background: #333; border: 1px solid #555;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .sync-node.active { background: var(--c-holo); box-shadow: 0 0 10px var(--c-holo); transform: scale(1.4); }

        #warp-btn {
            position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%);
            background: var(--c-warn); color: #fff; border: none;
            padding: 15px 40px; font-family: 'Press Start 2P'; font-size: 12px;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            opacity: 0; pointer-events: none; transition: opacity 1s, transform 0.3s;
            box-shadow: 0 0 20px var(--c-warn); z-index: 160;
        }
        #warp-btn:hover { transform: translateX(-50%) scale(1.05); }

        /* Boot Overlay */
        #bios-boot {
            position: fixed; inset: 0; background: #000; z-index: 999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: var(--c-holo); cursor: pointer;
        }
        .boot-txt { font-family: 'Press Start 2P'; font-size: 14px; animation: blink 1s infinite; margin-top:20px; }
        @keyframes blink { 50% { opacity: 0; } }

    </style>
</head>
<body>

        <source src="https://raw.githubusercontent.com/Notes356/NotasParsMIRO/8708091f749f048e765d3bfcbcb8f201e7515a45/retro-love-471512.mp3" type="audio/mpeg">
    </audio>

    <script>
        /**
         * ============================================================================
         * NUCLEO DE INGENIERÍA: PROYECTO ECO (MODO DIOS)
         * ============================================================================
         */

        // [CONSTANTES] BASE DE DATOS DE MEMORIA INMUTABLE
        const MEMORY_BANK = [
            { 
                type: 'text', x: 20, y: 30, 
                content: "A veces miro por la ventana y me pregunto si tú también estás mirando la misma luna.",
                image: "https://raw.githubusercontent.com/Notes356/NotasParsMIRO/2988b6cba45755fca543b33ecc8fd457337c5fe1/Im%C3%A1genesA/image-12.webp"
            },
            { 
                type: 'text', x: 75, y: 25, 
                content: "Este viaje se siente largo, pero cada kilómetro me acerca más a lo que quiero decirte.",
                image: "https://raw.githubusercontent.com/Notes356/NotasParsMIRO/2988b6cba45755fca543b33ecc8fd457337c5fe1/Im%C3%A1genesA/image-25.webp"
            },
            { type: 'video', x: 50, y: 50, content: "video_trigger" },
            { 
                type: 'text', x: 30, y: 70, 
                content: "No sé qué nos depara el destino, pero me alegra haber compartido este trayecto contigo.",
                image: "https://raw.githubusercontent.com/Notes356/NotasParsMIRO/2988b6cba45755fca543b33ecc8fd457337c5fe1/Im%C3%A1genesA/image-29.webp"
            },
            { 
                type: 'text', x: 80, y: 80, 
                content: "Guarda estos fragmentos. Son solo para ti.",
                image: "https://raw.githubusercontent.com/Notes356/NotasParsMIRO/2988b6cba45755fca543b33ecc8fd457337c5fe1/Im%C3%A1genesA/image-32.webp"
            }
        ];

        // [MODULO]: MOTOR DE AUDIO AVANZADO (PROCESAMIENTO ESPACIAL)
        const AudioEngine = {
            ctx: null,
            masterGain: null,
            sonarOsc: null,
            lastPing: 0,
            proximityFactor: 0, // 0 = lejos, 1 = encima

            init() {
                const AC = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AC();
                this.masterGain = this.ctx.createGain();
                this.masterGain.connect(this.ctx.destination);
                
                // Fade in música
                const music = document.getElementById('ambience-track');
                music.volume = 0; music.play();
                let v = 0;
                const f = setInterval(() => { if(v<0.4){v+=0.02; music.volume=v;}else clearInterval(f); }, 200);
            },

            // Sistema Sonar estilo "Geiger"
            updateSonar(distancePercent) {
                // distancePercent: 0 (encima) a 100 (lejos)
                // Invertimos: 1 (cerca) a 0 (lejos)
                const proximity = Math.max(0, 1 - (distancePercent / 40)); 
                this.proximityFactor = proximity;

                const now = this.ctx.currentTime;
                // Velocidad del ping basada en proximidad
                const pingInterval = 0.1 + (1 - proximity) * 1.5; 

                if (proximity > 0.1 && (now - this.lastPing > pingInterval)) {
                    this.ping(proximity);
                    this.lastPing = now;
                }
            },

            ping(intensity) {
                if(!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                // Frecuencia sube con intensidad
                osc.frequency.setValueAtTime(400 + (intensity * 800), this.ctx.currentTime);
                osc.type = 'sine';
                
                gain.gain.setValueAtTime(0, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.1 * intensity, this.ctx.currentTime + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
                
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            },

            playSFX(type) {
                if(!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                if(type === 'lock') {
                    osc.frequency.setValueAtTime(1200, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.3);
                    osc.type = 'sawtooth';
                } else if(type === 'type') {
                    osc.frequency.setValueAtTime(800 + Math.random()*200, this.ctx.currentTime);
                    osc.type = 'square';
                    gain.gain.value = 0.02;
                }
                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }
        };

        // [MODULO]: RENDERIZADO DE PARTÍCULAS (POLVO CUÁNTICO)
        const ParticleSystem = {
            canvas: document.getElementById('dust-canvas'),
            ctx: null,
            particles: [],
            width: 0, height: 0,
            cursor: { x: -100, y: -100 },

            init() {
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
                
                for(let i=0; i<60; i++) this.particles.push(this.createParticle());
                this.animate();
            },

            resize() {
                this.width = this.canvas.width = window.innerWidth;
                this.height = this.canvas.height = window.innerHeight;
            },

            createParticle() {
                return {
                    x: Math.random() * this.width,
                    y: Math.random() * this.height,
                    size: Math.random() * 2,
                    speedX: (Math.random() - 0.5) * 0.5,
                    speedY: (Math.random() - 0.5) * 0.5,
                    alpha: Math.random() * 0.5
                };
            },

            updateCursor(x, y) { this.cursor.x = x; this.cursor.y = y; },

            animate() {
                this.ctx.clearRect(0,0, this.width, this.height);
                
                this.particles.forEach(p => {
                    // Movimiento base
                    p.x += p.speedX;
                    p.y += p.speedY;

                    // Repulsión del escáner
                    const dx = p.x - this.cursor.x;
                    const dy = p.y - this.cursor.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if(dist < 100) {
                        const force = (100 - dist) / 100;
                        p.x += (dx / dist) * force * 2;
                        p.y += (dy / dist) * force * 2;
                        this.ctx.fillStyle = `rgba(0, 243, 255, ${p.alpha + 0.5})`; // Brillar al contacto
                    } else {
                        this.ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                    }

                    // Wrap around
                    if(p.x < 0) p.x = this.width;
                    if(p.x > this.width) p.x = 0;
                    if(p.y < 0) p.y = this.height;
                    if(p.y > this.height) p.y = 0;

                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                    this.ctx.fill();
                });

                requestAnimationFrame(() => this.animate());
            }
        };

        // [MODULO]: INTERFAZ DE DATOS (TERMINAL)
        const DataInterface = {
            dom: {
                terminal: document.getElementById('holo-terminal'),
                img: document.getElementById('term-img'),
                content: document.getElementById('term-content'),
                videoModal: document.getElementById('video-feed'),
                video: document.getElementById('vid-player')
            },
            typeInterval: null,

            openTerminal(data) {
                this.dom.terminal.classList.add('active');
                
                // Cargar imagen
                if(data.image) {
                    this.dom.img.src = data.image;
                    this.dom.img.style.display = 'block';
                } else {
                    this.dom.img.style.display = 'none';
                }

                // Efecto de Tipeo "Decrypter"
                this.dom.content.innerHTML = '';
                let index = 0;
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#@&%';
                
                clearInterval(this.typeInterval);
                this.typeInterval = setInterval(() => {
                    if(index < data.content.length) {
                        // Añadir letra correcta
                        const correct = data.content[index];
                        // Simular glitch con caracteres aleatorios al final
                        let glitch = '';
                        /*for(let j=0; j<3; j++) glitch += chars[Math.floor(Math.random()*chars.length)];*/
                        
                        this.dom.content.innerHTML = data.content.substring(0, index) + correct + '<span style="color:#fff; background:var(--c-holo)">_</span>';
                        index++;
                        if(index%2===0) AudioEngine.playSFX('type');
                    } else {
                        clearInterval(this.typeInterval);
                        this.dom.content.innerHTML = data.content; // Final limpio
                    }
                }, 30);
            },

            closeTerminal() {
                clearInterval(this.typeInterval);
                this.dom.terminal.classList.remove('active');
                SystemKernel.completeMemory();
            },

            openVideo() {
                this.dom.videoModal.classList.add('active');
                document.getElementById('ambience-track').volume = 0.1;
                this.dom.video.play();
            },
            
            closeVideo() {
                this.dom.videoModal.classList.remove('active');
                this.dom.video.pause();
                document.getElementById('ambience-track').volume = 0.4;
                SystemKernel.completeMemory();
            }
        };

        // [NUCLEO]: CONTROLADOR DEL SISTEMA (GAME LOOP)
        const SystemKernel = {
            state: {
                scanning: false,
                found: 0,
                nodes: [], // {x, y, found, el}
                mouse: { x: window.innerWidth/2, y: window.innerHeight/2 }
            },
            dom: {
                scanner: document.getElementById('scanner-hud'),
                world: document.getElementById('layer-world')
            },

            boot() {
                // Secuencia de inicio
                document.getElementById('bios-boot').style.display = 'none';
                AudioEngine.init();
                ParticleSystem.init();
                
                // Generar UI
                this.spawnNodes();
                this.generateStatusBar();

                this.state.scanning = true;
                
                // Input Listeners
                document.addEventListener('mousemove', e => this.updateInput(e.clientX, e.clientY));
                document.addEventListener('touchmove', e => {
                    e.preventDefault();
                    this.updateInput(e.touches[0].clientX, e.touches[0].clientY);
                }, {passive:false});

                // Iniciar Loop
                this.gameLoop();
                
                // Trigger inicial
                this.triggerEmote('unit-ella', '...');
            },

            spawnNodes() {
                const container = document.getElementById('memory-field');
                MEMORY_BANK.forEach((mem, i) => {
                    const el = document.createElement('div');
                    el.className = 'memory-node';
                    el.style.left = mem.x + '%';
                    el.style.top = mem.y + '%';
                    container.appendChild(el);
                    
                    // Guardar coordenadas pixel reales para cálculos rápidos
                    const rect = el.getBoundingClientRect();
                    this.state.nodes.push({
                        id: i,
                        cx: rect.left + rect.width/2,
                        cy: rect.top + rect.height/2,
                        found: false,
                        el: el
                    });
                });
            },

            generateStatusBar() {
                const bar = document.getElementById('status-bar');
                MEMORY_BANK.forEach(() => {
                    const n = document.createElement('div');
                    n.className = 'sync-node';
                    bar.appendChild(n);
                });
            },

            updateInput(x, y) {
                this.state.mouse.x = x;
                this.state.mouse.y = y;
                ParticleSystem.updateCursor(x, y);
                
                // Efecto Parallax en el fondo
                const px = (window.innerWidth - x) / 50;
                const py = (window.innerHeight - y) / 50;
                this.dom.world.style.transform = `translate(${px}px, ${py}px)`;
            },

            gameLoop() {
                if(this.state.scanning) {
                    // Mover HUD Escáner
                    this.dom.scanner.style.transform = `translate(${this.state.mouse.x}px, ${this.state.mouse.y}px)`;
                    
                    // Lógica de Detección
                    let nearestDist = 9999;
                    let targetNode = null;

                    this.state.nodes.forEach(node => {
                        if(node.found) return;
                        
                        const dist = Math.hypot(this.state.mouse.x - node.cx, this.state.mouse.y - node.cy);
                        if(dist < nearestDist) nearestDist = dist;

                        if(dist < 50) { // Radio de captura
                            if(!this.dom.scanner.classList.contains('locking')) {
                                this.startLock(node);
                            }
                            targetNode = node;
                        }
                    });

                    // Si no estamos bloqueando un objetivo, actualizar sonar
                    if(!targetNode) {
                        this.cancelLock();
                        // Convertir distancia px a porcentaje relativo de pantalla (aprox)
                        const screenDiag = Math.hypot(window.innerWidth, window.innerHeight);
                        const distPct = (nearestDist / screenDiag) * 100;
                        AudioEngine.updateSonar(distPct);
                    }
                }
                
                requestAnimationFrame(() => this.gameLoop());
            },

            lockTimer: null,
            startLock(node) {
                this.dom.scanner.classList.add('locking');
                this.triggerEmote('unit-yo', '?');
                
                this.lockTimer = setTimeout(() => {
                    this.activateMemory(node);
                }, 800); // Tiempo para escanear
            },

            cancelLock() {
                this.dom.scanner.classList.remove('locking');
                if(this.lockTimer) { clearTimeout(this.lockTimer); this.lockTimer = null; }
            },

            activateMemory(node) {
                this.state.scanning = false; // Pausar escaneo
                node.found = true;
                this.dom.scanner.style.opacity = '0'; // Ocultar escáner
                
                AudioEngine.playSFX('lock');
                this.triggerEmote('unit-ella', '!');
                
                const data = MEMORY_BANK[node.id];
                if(data.type === 'video') DataInterface.openVideo();
                else DataInterface.openTerminal(data);
            },

            completeMemory() {
                // Actualizar UI
                const dots = document.querySelectorAll('.sync-node');
                dots[this.state.found].classList.add('active');
                
                this.state.found++;
                this.state.scanning = true;
                this.dom.scanner.style.opacity = '1';
                
                this.triggerEmote('unit-yo', '✨');
                this.triggerEmote('unit-ella', '❤️');

                if(this.state.found === MEMORY_BANK.length) {
                    setTimeout(() => {
                        const btn = document.getElementById('warp-btn');
                        btn.style.opacity = '1';
                        btn.style.pointerEvents = 'auto';
                    }, 1000);
                }
            },

            triggerEmote(unitId, text) {
                const parent = document.getElementById(unitId === 'unit-ella' ? 'emote-anchor-ella' : 'emote-anchor-yo').parentNode;
                const el = document.createElement('div');
                el.className = 'emote-popup';
                el.innerText = text;
                parent.appendChild(el);
                setTimeout(() => el.remove(), 1500);
            },

            warpJump() {
                AudioEngine.playSFX('lock'); // Sonido final
                document.body.style.transition = "opacity 2s ease, filter 2s ease";
                document.body.style.opacity = "0";
                document.body.style.filter = "blur(20px) contrast(3)"; // Efecto Warp

                setTimeout(() => {
                    window.location.href = 'fase4.html';
                }, 2000);
            }
        };
    </script>
        <script type="module">
        import { registrarPaso } from './telemetry.js';
        registrarPaso("Eco II: El Viaje [God Mode]");
    </script>
