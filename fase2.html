    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    
    <style>
        /* =============================================================================
           SECCIÓN 1.0: CONSTANTES UNIVERSALES Y FÍSICA CSS
           ============================================================================= 
        */
        :root {
            /* MATERIA OSCURA Y FOTONES */
            --void-bg: #020205;
            --photon-color: #ffffff;
            --plasma-accent: #ff6b81; /* Color del corazón */
            --plasma-glow: rgba(255, 107, 129, 0.6);
            --nebula-overlay: rgba(20, 20, 35, 0.85);
            
            /* INTERFAZ */
            --glass-surface: rgba(15, 15, 20, 0.92);
            --glass-border: rgba(255, 255, 255, 0.12);
            --hologram-scan: rgba(255, 255, 255, 0.03);
            
            /* FUENTES */
            --font-terminal: 'VT323', monospace;
            --font-arcade: 'Press Start 2P', cursive;
            
            /* DINÁMICA DE TIEMPO */
            --pulse-rate: 4s; /* Ritmo cardíaco del fondo */
        }

        /* RESETEO DE FÍSICAS DEL NAVEGADOR */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--void-bg);
            font-family: var(--font-terminal);
            user-select: none;
            cursor: crosshair; /* Detalle técnico */
        }

        /* =============================================================================
           SECCIÓN 2.0: MOTOR DE RENDERIZADO (FONDOS Y ATMÓSFERA)
           ============================================================================= 
        */
        
        /* CAPA 2.1: FONDO VIVO (LATIDO) */
        #render-layer-bg {
            position: fixed; inset: -5%; /* Extendido para evitar bordes al escalar */
            width: 110%; height: 110%;
            background-image: url('https://raw.githubusercontent.com/Notes356/NotasParsMIRO/93b1e8648e0e549080f108abcaf7eea0a2e9a657/image-2.webp');
            background-size: cover;
            background-position: center;
            z-index: 0;
            filter: brightness(0.5) contrast(1.2) grayscale(0.2);
            
            /* ANIMACIÓN DE RESPIRACIÓN/LATIDO */
            animation: bio-pulse var(--pulse-rate) infinite ease-in-out;
            transform-origin: center center;
            will-change: transform, filter;
        }

        @keyframes bio-pulse {
            0% { transform: scale(1); filter: brightness(0.5); }
            50% { transform: scale(1.02); filter: brightness(0.6) hue-rotate(-5deg); }
            100% { transform: scale(1); filter: brightness(0.5); }
        }

        /* CAPA 2.2: FILTRO CRT (TUBOS DE RAYOS CATÓDICOS) */
        .shader-crt {
            position: fixed; inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 3px;
            z-index: 5; pointer-events: none; opacity: 0.4;
        }

        .shader-vignette {
            position: fixed; inset: 0;
            background: radial-gradient(circle, transparent 40%, #000 100%);
            z-index: 6; pointer-events: none;
        }

        /* CAPA 2.3: CAMPO DE PARTÍCULAS CUÁNTICAS */
        #quantum-field {
            position: fixed; inset: 0; z-index: 4; pointer-events: none;
        }

        .quantum-particle {
            position: absolute;
            background: var(--photon-color);
            border-radius: 50%;
            opacity: 0;
            box-shadow: 0 0 4px var(--photon-color);
            animation: drift-up 12s infinite linear;
        }

        @keyframes drift-up {
            0% { transform: translateY(105vh) scale(0.5); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* =============================================================================
           SECCIÓN 3.0: INTERFAZ DE COMUNICACIÓN (MESSENGER STACK)
           ============================================================================= 
        */
        #comm-stream-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 82%; /* Espacio reservado para HUD */
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Gravedad inversa: mensajes nacen abajo */
            align-items: center;
            padding-bottom: 20px;
            pointer-events: none;
        }

        /* MÓDULO DE MENSAJE (BURBUJA) */
        .data-packet {
            pointer-events: auto;
            background: var(--glass-surface);
            border: 1px solid var(--glass-border);
            border-left: 3px solid var(--plasma-accent); /* Acento técnico a la izquierda */
            
            color: #e0e0e0;
            padding: 16px 24px;
            margin: 8px 0;
            
            font-size: 1.5rem;
            line-height: 1.2;
            text-align: center;
            max-width: 88%;
            min-width: 200px;
            
            /* EFECTOS AVANZADOS */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            
            /* ANIMACIÓN DE ENTRADA (FÍSICA ELÁSTICA) */
            opacity: 0;
            transform: translateY(60px) scale(0.9);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .data-packet.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* ESTADO: INTERACCIÓN TÁCTIL */
        .data-packet:active {
            border-color: var(--plasma-accent);
            color: var(--plasma-accent);
            box-shadow: 0 0 20px var(--plasma-glow);
            transform: scale(0.98);
        }

        /* =============================================================================
           SECCIÓN 4.0: HUD DE SISTEMA (BARRA DE PROGRESO Y CONTROLES)
           ============================================================================= 
        */
        .sys-hud-wrapper {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%);
            width: 200px; z-index: 50;
            opacity: 0; transition: opacity 1s;
            display: flex; flex-direction: column; align-items: center;
        }

        /* MARCO DE ENERGÍA */
        .energy-bar-frame {
            width: 100%; height: 12px;
            background: #000;
            border: 1px solid #555;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            position: relative; overflow: hidden;
        }

        /* NÚCLEO DE FUSIÓN (RELLENO ARCOÍRIS) */
        .energy-core-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
            background-size: 200% 200%;
            animation: spectral-flow 2s linear infinite;
            transition: width 0.4s ease-out;
        }
        
        /* DETALLE TÉCNICO: MALLA SOBRE LA BARRA */
        .energy-bar-frame::after {
            content: ''; position: absolute; inset: 0;
            background: repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.5) 3px);
            pointer-events: none;
        }

        @keyframes spectral-flow { 0% {background-position:100% 50%} 100% {background-position:0% 50%} }

        /* BOTÓN DE HIPERSALTO */
        #hyper-jump-btn {
            position: fixed; bottom: 80px; left: 0; right: 0;
            display: flex; justify-content: center;
            z-index: 60; pointer-events: none; opacity: 0;
            transition: opacity 1s ease;
        }

        .btn-singularity {
            pointer-events: auto;
            background: var(--plasma-accent);
            color: #fff;
            font-family: var(--font-arcade);
            font-size: 12px;
            padding: 15px 30px;
            border: none;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%); /* FORMA SCI-FI */
            box-shadow: 0 0 15px var(--plasma-glow);
            text-transform: uppercase;
            animation: btn-breathing 2s infinite;
        }

        @keyframes btn-breathing { 
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px var(--plasma-glow); } 
            50% { transform: scale(1.05); box-shadow: 0 0 30px var(--plasma-glow), inset 0 0 10px white; } 
        }

        /* =============================================================================
           SECCIÓN 5.0: BOOTLOADER (PANTALLA DE INICIO)
           ============================================================================= 
        */
        #bios-screen {
            position: fixed; inset: 0;
            background-color: #000;
            z-index: 9999;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: white;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* CORAZÓN DIGITAL */
        .core-heart {
            font-size: 48px; color: var(--plasma-accent);
            animation: systole-diastole 1.2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
            margin-bottom: 25px;
            text-shadow: 0 0 20px var(--plasma-accent);
        }
        @keyframes systole-diastole { 
            0% { transform: scale(1); } 14% { transform: scale(1.3); } 28% { transform: scale(1); } 
            42% { transform: scale(1.3); } 70% { transform: scale(1); } 
        }

        .sys-info {
            font-family: var(--font-terminal);
            color: #666; font-size: 14px; margin-bottom: 40px;
            letter-spacing: 3px; text-transform: uppercase;
        }

        /* DISPARADOR TÁCTIL (BOTÓN PRINCIPAL) */
        .trigger-link {
            font-family: var(--font-arcade);
            font-size: 13px;
            color: #fff;
            border: 2px solid var(--plasma-accent);
            padding: 20px 40px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            background: rgba(255, 107, 129, 0.1);
            box-shadow: 0 0 15px var(--plasma-glow);
            animation: signal-blink 3s infinite;
        }
        
        /* EFECTO DE BARRIDO EN EL BOTÓN */
        .trigger-link::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: scan-swipe 2.5s infinite;
        }

        @keyframes signal-blink { 50% { border-color: #fff; text-shadow: 0 0 10px #fff; } }
        @keyframes scan-swipe { 0% { left: -100%; } 100% { left: 200%; } }

    </style>
</head>
<body>

    <audio id="primary-audio-stream" loop preload="auto">
        <source src="https://raw.githubusercontent.com/Notes356/NotasParsMIRO/83cc5716717c3fcbd5b70a0fce22e619326aff70/pixelated-game-vibe-music-450640.mp3" type="audio/mpeg">
    </audio>

    <div id="bios-screen">
        <div class="core-heart">❤</div>
        <div class="sys-info">Sincronizando Biosentimientos...</div>
        
        <div class="trigger-link" id="init-sequence-btn">Eco I Conexión</div>

    <div id="render-layer-bg"></div> <div class="shader-vignette"></div>
    <div class="shader-crt"></div>
    <div id="quantum-field"></div> <div id="comm-stream-container">
        </div>

    <div class="sys-hud-wrapper" id="ui-hud">
        <div class="energy-bar-frame">
            <div id="energy-fill" class="energy-core-fill"></div>

    <div id="hyper-jump-btn">
        <button class="btn-singularity" onclick="NexusCore.executePhaseShift()">CONTINUAR ➔</button>
    </div>

    <script>
        /**
         * [CONFIG]: ARCHIVOS DE MEMORIA DE SÓLO LECTURA
         * ADVERTENCIA: NO MODIFICAR CONSTANTES NARRATIVAS.
         */
        const MEMORY_BANK = {
            dialogues: [
                "A veces las palabras sobran...",
                "Pero los sentimientos queman.",
                "Me es difícil mirar al costado.",
                "Es un detalle a lo que qué creía.",
                "Este es el inicio del camino.",
                "¿Me acompañas un poco más?"
            ],
            metrics: {
                packetDelay: 3800, // Latencia entre inyecciones de texto
                transitionTime: 1800, // Tiempo de warp
                particleCount: 50
            }
        };

        /**
         * [MODULE]: MOTOR DE AUDIO PROCEDIMENTAL
         * Genera tonos sintéticos en tiempo real para feedback háptico-auditivo.
         */
        const AudioForge = {
            context: null,
            bgStream: document.getElementById('primary-audio-stream'),

            initialize() {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.context = new AudioContext();
            },

            engageThrusters() {
                // Reactivar contexto si estaba en stand-by
                if(this.context.state === 'suspended') this.context.resume();
                
                this.bgStream.volume = 0;
                this.bgStream.play().then(() => {
                    this.fadeProcess(this.bgStream, 0.6, 2000); // Fade-in logarítmico
                }).catch(err => console.warn("[AUDIO_FAIL]: Interacción requerida", err));
            },

            // Generador de Tono Senoidal (Feedback de mensaje)
            synthesizeBlip() {
                if (!this.context) return;
                
                // Oscilador 1: Tono base
                const osc = this.context.createOscillator();
                const gain = this.context.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, this.context.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, this.context.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.04, this.context.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.context.currentTime + 0.2);
                
                osc.connect(gain);
                gain.connect(this.context.destination);
                
                osc.start();
                osc.stop(this.context.currentTime + 0.2);
            },

            fadeProcess(element, targetVol, duration) {
                let current = 0;
                const stepTime = 50;
                const stepVal = targetVol / (duration / stepTime);
                const timer = setInterval(() => {
                    if (current < targetVol) {
                        current += stepVal;
                        element.volume = current;
                    } else clearInterval(timer);
                }, stepTime);
            },

            shutdownSequence(callback) {
                let vol = this.bgStream.volume;
                const timer = setInterval(() => {
                    if (vol > 0.05) {
                        vol -= 0.05;
                        this.bgStream.volume = vol;
                    } else {
                        clearInterval(timer);
                        if(callback) callback();
                    }
                }, 100);
            }
        };

        /**
         * [MODULE]: SISTEMA DE PARTÍCULAS CUÁNTICAS
         * Simulación física ligera para ambiente.
         */
        const QuantumRender = {
            container: document.getElementById('quantum-field'),

            spawnField() {
                const frag = document.createDocumentFragment();
                for (let i = 0; i < MEMORY_BANK.metrics.particleCount; i++) {
                    const photon = document.createElement('div');
                    photon.className = 'quantum-particle';
                    
                    // Aleatoriedad controlada
                    const size = Math.random() * 2 + 1; // 1px a 3px
                    photon.style.width = size + 'px';
                    photon.style.height = size + 'px';
                    photon.style.left = Math.random() * 100 + '%';
                    
                    // Parámetros de tiempo
                    photon.style.animationDuration = (8 + Math.random() * 10) + 's';
                    photon.style.animationDelay = (Math.random() * 5) + 's';
                    
                    frag.appendChild(photon);
                }
                this.container.appendChild(frag);
            }
        };

        /**
         * [CORE]: NEXUS CONTROLLER
         * Orquestador principal de la lógica de negocio y UI.
         */
        const NexusCore = {
            cycleIndex: 0,
            uiStack: document.getElementById('comm-stream-container'),
            energyBar: document.getElementById('energy-fill'),
            exitNode: document.getElementById('hyper-jump-btn'),
            bootLayer: document.getElementById('bios-screen'),
            initTrigger: document.getElementById('init-sequence-btn'),

            // [INIT]: Secuencia de arranque
            bootSystem() {
                this.initTrigger.addEventListener('click', () => {
                    console.log("[SYSTEM]: INITIATING CONNECTION SEQUENCE...");
                    
                    // 1. Eliminar Boot Screen
                    this.bootLayer.style.opacity = '0';
                    setTimeout(() => this.bootLayer.style.display = 'none', 800);

                    // 2. Encender Motores
                    AudioForge.initialize();
                    AudioForge.engageThrusters();
                    QuantumRender.spawnField();
                    
                    // 3. Mostrar HUD
                    document.getElementById('ui-hud').style.opacity = '1';

                    // 4. Iniciar Loop Narrativo
                    setTimeout(() => this.runDataStream(), 500);
                });
            },

            // [LOOP]: Inyección de Mensajes
            runDataStream() {
                if (this.cycleIndex < MEMORY_BANK.dialogues.length) {
                    const text = MEMORY_BANK.dialogues[this.cycleIndex];
                    this.injectPacket(text);
                    
                    // Actualizar Energía
                    const charge = ((this.cycleIndex + 1) / MEMORY_BANK.dialogues.length) * 100;
                    this.energyBar.style.width = charge + '%';

                    this.cycleIndex++;
                    setTimeout(() => this.runDataStream(), MEMORY_BANK.metrics.packetDelay);
                } else {
                    this.finalizeProtocol();
                }
            },

            // [RENDER]: Creación DOM de Mensaje
            injectPacket(msg) {
                const packet = document.createElement('div');
                packet.className = 'data-packet';
                packet.innerText = msg;
                
                // Feedback Sonoro
                AudioForge.synthesizeBlip();
                
                // Interacción
                packet.onclick = function() {
                    this.style.borderColor = '#ff6b81';
                    this.style.boxShadow = '0 0 25px rgba(255,107,129,0.8)';
                };

                this.uiStack.appendChild(packet);
                
                // Forzar Reflow para animación
                requestAnimationFrame(() => packet.classList.add('active'));

                // Garbage Collection (Gestión de Memoria):
                // Mantener limpios los nodos viejos para evitar lag en móviles
                const bufferSize = 4;
                if (this.uiStack.children.length > bufferSize) {
                    const oldNode = this.uiStack.children[0];
                    oldNode.style.opacity = '0';
                    oldNode.style.transform = 'translateY(-20px) scale(0.8)';
                    setTimeout(() => oldNode.remove(), 600);
                }
            },

            finalizeProtocol() {
                console.log("[SYSTEM]: DATA STREAM COMPLETE. AWAITING USER INPUT.");
                setTimeout(() => {
                    this.exitNode.style.opacity = '1';
                    this.exitNode.style.pointerEvents = 'auto';
                }, 1000);
            },

            executePhaseShift() {
                console.log("[SYSTEM]: EXECUTING PHASE SHIFT...");
                
                // Efecto Warp Visual
                document.body.style.transition = "filter 1.5s ease, opacity 1.5s ease";
                document.body.style.filter = "blur(15px) contrast(2)"; // Warp Drive Effect
                document.body.style.opacity = "0";

                AudioForge.shutdownSequence(() => {
                    window.location.href = 'fase3.html';
                });
            }
        };

        // PUNTO DE ENTRADA AL MAIN FRAME
        window.onload = () => NexusCore.bootSystem();

    </script>

    <script type="module">
        import { registrarPaso } from './telemetry.js';
        try {
            // Retraso intencional para priorizar renderizado gráfico
            setTimeout(() => {
                registrarPaso("Eco I: Conexión [Quantum Core]");
                console.log("[TELEMETRY]: LINK ESTABLISHED.");
            }, 2000);
        } catch (error) {
            console.error("[TELEMETRY_FAIL]: OFFLINE MODE ACTIVE.");
        }
    </script>
