    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* =============================================================================
           FASE 1.0: EL MOTOR DE REALIDAD (CSS CORE)
           ============================================================================= */
        :root {
            --void-dark: #020205;
            --ui-glass: rgba(10, 15, 25, 0.92);
            --soul-gold: #ffd700;   
            --soul-blue: #00f3ff;   
            --soul-red: #ff003c;    
            --crt-scan: rgba(0, 0, 0, 0.5);
            --cursor-x: 50vw; /* VARIABLE PARA LINTERNA */
            --cursor-y: 50vh; /* VARIABLE PARA LINTERNA */
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--void-dark);
            font-family: 'VT323', monospace; color: white;
            cursor: crosshair; /* Cursor táctico */
        }

        /* --- INYECCIÓN DE ESTEROIDES: ILUMINACIÓN DINÁMICA --- */
        body::before {
            content: ''; position: fixed; inset: 0; z-index: 5; pointer-events: none;
            background: radial-gradient(circle 400px at var(--cursor-x) var(--cursor-y), transparent 0%, rgba(0,0,0,0.8) 100%);
            mix-blend-mode: multiply;
        }

        /* --- INYECCIÓN DE ESTEROIDES: SCREEN SHAKE --- */
        .shake-hard { animation: shake 0.25s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 
            10%, 90% { transform: translate3d(-2px, 2px, 0); } 
            20%, 80% { transform: translate3d(4px, -2px, 0); } 
            30%, 50%, 70% { transform: translate3d(-6px, 4px, 0); } 
            40%, 60% { transform: translate3d(6px, -4px, 0); } 
        }

        /* -------------------------------------------------------------------------
           SUBFASE 1.1: EFECTOS DE POST-PROCESADO (ATMÓSFERA)
           ------------------------------------------------------------------------- */
        .fx-crt {
            position: fixed; inset: 0; pointer-events: none; z-index: 999;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                        linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06));
            background-size: 100% 3px, 3px 100%;
            animation: flicker 0.15s infinite;
        }

        .fx-vignette {
            position: fixed; inset: 0; pointer-events: none; z-index: 998;
            background: radial-gradient(circle, transparent 50%, #000 130%);
        }

        .fx-noise {
            position: fixed; inset: 0; pointer-events: none; z-index: 997; opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        @keyframes flicker { 0% { opacity: 0.95; } 100% { opacity: 1; } }

        /* =============================================================================
           FASE 2.0: ESCENARIO PARALLAX
           ============================================================================= */
        #reality-viewport {
            position: absolute; inset: 0; overflow: hidden;
            perspective: 1000px; 
            transition: filter 0.2s; /* Más rápido para efectos de golpe */
        }

        #world-track {
            display: flex; height: 100%; width: 400vw;
            will-change: transform;
            transition: transform 1.8s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .biome-sector {
            width: 100vw; height: 100%; position: relative;
            background-size: cover; background-position: center;
            image-rendering: pixelated; flex-shrink: 0; overflow: hidden;
        }

        /* CONFIGURACIÓN DE BIOMAS (CON ABERRACIÓN CROMÁTICA AÑADIDA) */
        #sector-alpha { 
            background-image: url('https://raw.githubusercontent.com/Notes356/NotasParsMIRO/4d63dd7f2a5b05f6bb427b8af684b1f44ed41824/Fase4/image-33.webp');
            filter: contrast(1.2) saturate(0.8) brightness(0.6);
        }
        #sector-beta { 
            background-image: url('https://raw.githubusercontent.com/Notes356/NotasParsMIRO/4d63dd7f2a5b05f6bb427b8af684b1f44ed41824/Fase4/image-35.webp');
            filter: hue-rotate(15deg) contrast(1.3) brightness(0.7);
        }
        #sector-gamma { 
            background-image: url('https://raw.githubusercontent.com/Notes356/NotasParsMIRO/4d63dd7f2a5b05f6bb427b8af684b1f44ed41824/Fase4/image-39.webp');
            filter: sepia(0.8) brightness(0.6) contrast(1.4);
        }
        #sector-delta { 
            background-image: url('https://raw.githubusercontent.com/Notes356/NotasParsMIRO/4d63dd7f2a5b05f6bb427b8af684b1f44ed41824/Fase4/image-38.webp');
            filter: grayscale(1) brightness(0.4) contrast(1.5);
        }

        /* CAPA DE PARTÍCULAS (CANVAS) */
        .particle-canvas {
            position: absolute; top:0; left:0; width:100%; height:100%;
            pointer-events: none; z-index: 10;
        }

        /* =============================================================================
           FASE 3.0: ENTIDADES
           ============================================================================= */
        #traveler-entity {
            position: fixed; bottom: 18%; left: 50%; transform: translateX(-50%);
            width: 150px; z-index: 500; pointer-events: none;
            image-rendering: pixelated; filter: drop-shadow(0 20px 20px rgba(0,0,0,0.9));
            transition: filter 0.5s;
        }
        .anim-breathe { animation: breathe 3s infinite ease-in-out; }
        .anim-warp { animation: warpWalk 0.3s infinite steps(2); filter: blur(2px) hue-rotate(90deg) !important; }

        @keyframes breathe { 0%, 100% { transform: translateX(-50%) scaleY(1); } 50% { transform: translateX(-50%) scaleY(1.04); } }
        @keyframes warpWalk { 0% { transform: translateX(-52%) translateY(0) skewX(-10deg); } 50% { transform: translateX(-48%) translateY(-5px) skewX(10deg); } }

        #echo-entity {
            position: absolute; bottom: 22%; right: 20%; width: 130px;
            opacity: 0; filter: blur(2px) grayscale(1) brightness(2);
            mix-blend-mode: overlay; pointer-events: none;
            transition: opacity 2s;
        }

        /* ARTEFACTOS (ESTERIODES: BRILLO NEÓN) */
        .artifact-node {
            position: absolute; bottom: 45%; width: 70px; height: 70px;
            background: rgba(0, 0, 0, 0.4); border: 2px solid var(--soul-blue);
            box-shadow: 0 0 20px var(--soul-blue); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 28px; cursor: pointer; z-index: 100;
            backdrop-filter: blur(4px); animation: floatArtifact 4s infinite ease-in-out;
            transition: transform 0.1s;
        }
        .artifact-node:hover { transform: scale(1.1); background: var(--soul-blue); color: black; }
        .artifact-node:active { transform: scale(0.9); border-color: var(--soul-gold); box-shadow: 0 0 30px var(--soul-gold); }
        .artifact-node.extracted { animation: extractSequence 0.5s forwards; pointer-events: none; }

        @keyframes floatArtifact { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes extractSequence { 
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.5); filter: brightness(3); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* =============================================================================
           FASE 4.0: HUD
           ============================================================================= */
        #head-up-display { position: fixed; inset: 0; pointer-events: none; z-index: 800; }

        .status-module {
            position: absolute; top: 20px;
            background: var(--ui-glass); border: 1px solid var(--ui-border);
            padding: 8px 16px; font-family: 'Orbitron', sans-serif; font-size: 10px; color: var(--soul-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            text-shadow: 0 0 5px var(--soul-blue); /* NEON TEXT */
        }
        #mod-loc { left: 20px; border-left: 3px solid var(--soul-gold); }
        #mod-sync { right: 20px; border-right: 3px solid var(--soul-purple); }

        #neural-console {
            position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 650px; background: rgba(5, 8, 10, 0.96);
            border: 1px solid #333; border-top: 2px solid var(--soul-gold);
            padding: 20px; display: none; pointer-events: auto;
            font-family: 'VT323', monospace; font-size: 1.5rem; color: #a8e6cf;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .control-deck {
            position: absolute; bottom: 30px; width: 100%;
            display: flex; justify-content: space-between; padding: 0 30px;
        }
        .nav-btn {
            pointer-events: auto; width: 70px; height: 70px;
            background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px; color: white; font-size: 24px; transition: 0.2s;
            backdrop-filter: blur(5px);
        }
        .nav-btn:disabled { opacity: 0.1; pointer-events: none; }
        .nav-btn:active { background: var(--soul-gold); color: black; box-shadow: 0 0 20px var(--soul-gold); }

        /* =============================================================================
           FASE 5.0: SISTEMA DE COLAPSO (REPARADO Y MEJORADO)
           ============================================================================= */
        #critical-failure-layer {
            position: fixed; inset: 0; z-index: 2000;
            background: #000; display: none;
            flex-direction: column; align-items: center; justify-content: center;
        }

        #heart-reactor {
            font-size: 100px; color: var(--soul-red);
            filter: drop-shadow(0 0 30px var(--soul-red));
            animation: criticalPulse 0.4s infinite; cursor: pointer; pointer-events: auto;
            transition: transform 0.05s;
            user-select: none;
        }
        #heart-reactor:active { transform: scale(0.85); filter: brightness(3); }

        /* PARTICULAS DE EXPLOSIÓN CSS */
        .spark {
            position: absolute; width: 6px; height: 6px; background: var(--soul-gold);
            border-radius: 50%; pointer-events: none;
            animation: sparkFly 0.6s ease-out forwards;
        }
        @keyframes sparkFly { 
            0% { transform: translate(0,0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        .integrity-bar {
            width: 300px; height: 14px; background: #111; margin-top: 40px;
            position: relative; overflow: hidden; border: 2px solid #555;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #integrity-fill {
            width: 50%; height: 100%; background: linear-gradient(90deg, var(--soul-red), #ff6b6b);
            box-shadow: 0 0 20px var(--soul-red);
            transition: width 0.1s linear;
        }

        /* BOTÓN DE CONTINUAR / SALVACIÓN */
        #continue-btn {
            margin-top: 30px;
            padding: 20px 40px;
            background: black;
            border: 3px solid var(--soul-gold);
            color: var(--soul-gold);
            font-family: 'Orbitron';
            font-size: 16px; font-weight: bold;
            letter-spacing: 3px;
            cursor: pointer;
            pointer-events: auto;
            display: none; /* Oculto inicialmente */
            animation: fadeInBtn 1s forwards;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            text-transform: uppercase;
        }
        #continue-btn:hover { background: var(--soul-gold); color: black; box-shadow: 0 0 50px var(--soul-gold); }

        .glitch-text-node {
            position: absolute; font-family: 'Press Start 2P'; font-size: 12px; color: var(--soul-red);
            background: #000; padding: 4px 8px; pointer-events: none;
            border: 1px solid red;
        }

        @keyframes criticalPulse { 0% { opacity: 0.8; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); } 100% { opacity: 0.8; transform: scale(1); } }
        @keyframes fadeInBtn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* PANTALLA DE CARGA */
        #boot-sequence {
            position: fixed; inset: 0; background: #000; z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: var(--soul-blue); font-family: 'Orbitron'; cursor: pointer;
        }
    </style>
</head>

    <audio id="ambience-stream" loop>
        <source src="https://raw.githubusercontent.com/Notes356/NotasParsMIRO/4d63dd7f2a5b05f6bb427b8af684b1f44ed41824/Fase4/pixel-dreams-259187.ogg" type="audio/ogg">
    </audio>

    <script>
        /**
         * ============================================================================
         * ARCHITECT KERNEL V.6.0 [TITAN EDITION]
         * ============================================================================
         */

        const ASSETS = {
            avatarNormal: "https://raw.githubusercontent.com/Notes356/NotasParsMIRO/b32ef0a23b35cffc8d5362ac0476cdb1bed418de/Fase4/Picsart_26-02-03_12-01-14-752.webp",
            avatarGlitch: "https://raw.githubusercontent.com/Notes356/NotasParsMIRO/b32ef0a23b35cffc8d5362ac0476cdb1bed418de/Fase4/Picsart_26-02-03_11-41-34-090.webp"
        };

        // --- SISTEMA DE ILUMINACIÓN DINÁMICA (LINTERNA) ---
        document.addEventListener('mousemove', (e) => {
            document.documentElement.style.setProperty('--cursor-x', e.clientX + 'px');
            document.documentElement.style.setProperty('--cursor-y', e.clientY + 'px');
        });

        // --- SISTEMA DE AUDIO (SYNTH + NOISE UPGRADE) ---
        const SoundSynth = {
            ctx: null,
            init() { 
                const AC = window.AudioContext || window.webkitAudioContext; 
                this.ctx = new AC(); 
            },
            tone(freq, type, duration) {
                if(!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type; 
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                // Pitch drop effect para más impacto
                osc.frequency.exponentialRampToValueAtTime(freq * 0.5, this.ctx.currentTime + duration);
                
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + duration);
            },
            noiseBurst() { // Nuevo sonido sucio para glitches
                if(!this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 0.1;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const gain = this.ctx.createGain();
                gain.gain.value = 0.1;
                noise.connect(gain); gain.connect(this.ctx.destination);
                noise.start();
            }
        };

        // --- SISTEMA DE VFX (VISUAL EFFECTS) ---
        const VFX = {
            shake() {
                document.body.classList.remove('shake-hard');
                void document.body.offsetWidth; // Trigger reflow
                document.body.classList.add('shake-hard');
            },
            spark(x, y) {
                const colors = ['#ff003c', '#ffd700', '#ffffff'];
                for(let i=0; i<8; i++) {
                    const el = document.createElement('div');
                    el.className = 'spark';
                    el.style.left = x + 'px';
                    el.style.top = y + 'px';
                    el.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
                    el.style.setProperty('--tx', (Math.random()*200 - 100) + 'px');
                    el.style.setProperty('--ty', (Math.random()*200 - 100) + 'px');
                    document.getElementById('critical-failure-layer').appendChild(el);
                    setTimeout(() => el.remove(), 600);
                }
            }
        };

        // --- SISTEMA DE PARTÍCULAS (CANVAS RESTAURADO) ---
        const Atmosphere = {
            active: true,
            init() {
                this.spawn('canvas-alpha', '#a8e6cf', 'float');
                this.spawn('canvas-beta', '#bd00ff', 'rain');
                this.spawn('canvas-gamma', '#ffd700', 'dust');
            },
            spawn(canvasId, color, mode) {
                const cvs = document.getElementById(canvasId);
                const ctx = cvs.getContext('2d');
                cvs.width = window.innerWidth; cvs.height = window.innerHeight;
                
                const particles = [];
                for(let i=0; i<45; i++) {
                    particles.push({
                        x: Math.random() * cvs.width,
                        y: Math.random() * cvs.height,
                        s: Math.random() * 2.5, // Partículas más grandes
                        v: Math.random() * 1 + 0.5
                    });
                }

                const animate = () => {
                    if(!this.active) return;
                    ctx.clearRect(0, 0, cvs.width, cvs.height);
                    ctx.fillStyle = color;
                    
                    particles.forEach(p => {
                        if(mode === 'float') p.y -= p.v * 0.5; 
                        if(mode === 'rain') p.y += p.v * 2;   
                        if(mode === 'dust') { p.x += (Math.random()-0.5); p.y += (Math.random()-0.5); }

                        if(p.y < 0 && mode === 'float') p.y = cvs.height;
                        if(p.y > cvs.height && mode === 'rain') p.y = 0;
                        
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    requestAnimationFrame(animate);
                };
                animate();
            }
        };

        // --- LÓGICA DEL JUEGO ---
        const SystemKernel = {
            sector: 0,
            dataFragments: [0, 0, 0],
            isProcessing: false,
            consoleBusy: false,

            boot() {
                const screen = document.getElementById('boot-sequence');
                screen.style.opacity = '0';
                setTimeout(() => screen.remove(), 1000);
                
                SoundSynth.init();
                Atmosphere.init();
                
                const audio = document.getElementById('ambience-stream');
                audio.volume = 0.5; audio.play().catch(e=>console.log(e));

                document.getElementById('traveler-entity').src = ASSETS.avatarNormal;
                this.updateHUD();
            },

            warp(dir) {
                if(this.isProcessing || this.consoleBusy) return;
                
                const target = this.sector + dir;
                if(target < 0 || target > 3) return;

                this.isProcessing = true;
                this.sector = target;
                SoundSynth.tone(150, 'sawtooth', 0.8); // Warp Sound más agresivo
                VFX.shake(); // Screen Shake en el salto

                const player = document.getElementById('traveler-entity');
                const track = document.getElementById('world-track');
                const ghost = document.getElementById('echo-entity');

                if(this.sector >= 2) player.src = ASSETS.avatarGlitch;
                else player.src = ASSETS.avatarNormal;

                player.classList.remove('anim-breathe');
                player.classList.add('anim-warp');
                
                // Efecto de blur en movimiento
                document.getElementById('reality-viewport').style.filter = "blur(4px)";
                track.style.transform = `translateX(-${this.sector * 100}vw)`;

                setTimeout(() => {
                    this.isProcessing = false;
                    document.getElementById('reality-viewport').style.filter = "none";
                    player.classList.remove('anim-warp');
                    player.classList.add('anim-breathe');
                    this.updateHUD();

                    ghost.style.opacity = (this.sector === 2) ? '0.6' : '0';

                    if(this.sector === 3) setTimeout(() => CollapseEngine.trigger(), 1000);

                }, 1500);
            },

            analyze(id, data, sectorId) {
                if(this.consoleBusy) return;

                const node = document.querySelectorAll('.artifact-node')[id];
                if(node.classList.contains('extracted')) return;

                this.consoleBusy = true; 
                node.classList.add('extracted');
                SoundSynth.tone(600 + (id*50), 'sine', 0.3); 
                VFX.shake(); // Screen Shake al recolectar

                this.dataFragments[sectorId]++;
                this.updateHUD();

                this.decryptMessage(data, () => {
                    this.consoleBusy = false;
                    this.updateHUD();
                });
            },

            decryptMessage(text, callback) {
                const consoleUI = document.getElementById('neural-console');
                consoleUI.style.display = 'block';
                consoleUI.innerHTML = '<span class="blinking-cursor"></span>';
                
                let iteration = 0;
                const characters = 'ABCDEF123456789#@&?!$';
                
                const interval = setInterval(() => {
                    let output = "";
                    for(let i = 0; i < text.length; i++) {
                        if(i < iteration) output += text[i];
                        else output += characters[Math.floor(Math.random() * characters.length)];
                    }
                    consoleUI.innerHTML = output;
                    SoundSynth.noiseBurst(); // Sonido de escritura glitch
                    
                    if(iteration >= text.length) {
                        clearInterval(interval);
                        setTimeout(() => {
                            consoleUI.style.display = 'none';
                            callback();
                        }, 2500);
                    }
                    iteration += 1;
                }, 20);
            },

            updateHUD() {
                const zones = ["FACULTAD", "CIUDAD", "MEMORIA", "VACÍO"];
                document.getElementById('mod-loc').innerText = `SEC: ${zones[this.sector]}`;
                document.getElementById('mod-sync').innerText = `SYNC: ${this.dataFragments[this.sector] || 0}/3`;

                const btnPrev = document.getElementById('nav-prev');
                const btnNext = document.getElementById('nav-next');

                btnPrev.disabled = (this.sector === 0);
                
                const completed = this.dataFragments[this.sector] >= 3;
                if(completed && !this.consoleBusy) {
                    btnNext.disabled = false;
                    btnNext.style.background = "var(--soul-gold)";
                    btnNext.style.color = "black";
                    btnNext.style.boxShadow = "0 0 20px var(--soul-gold)";
                } else {
                    btnNext.disabled = true;
                    btnNext.style.background = "rgba(255,255,255,0.05)";
                    btnNext.style.color = "white";
                    btnNext.style.boxShadow = "none";
                }
                
                if(this.sector === 3) btnNext.disabled = true;
            }
        };

        // --- MOTOR DE COLAPSO (ESTEROIDES ACTIVADOS) ---
        const CollapseEngine = {
            integrity: 30,
            active: false,
            decayRate: 0.15, 
            clickPower: 12,  
            
            trigger() {
                document.getElementById('head-up-display').style.display = 'none';
                document.getElementById('critical-failure-layer').style.display = 'flex';
                this.active = true;
                
                const audio = document.getElementById('ambience-stream');
                audio.playbackRate = 0.5; 
                
                this.spawnGlitches();
                this.decayLoop();

                setTimeout(() => {
                    if(this.active) {
                        this.showButton("TIEMPO AGOTADO - CONTINUAR");
                    }
                }, 10000);
            },

            beat(e) { // Acepta el evento del mouse para las partículas
                if(!this.active) return;
                this.integrity += this.clickPower;
                
                // VFX EXPLOSIVOS
                SoundSynth.tone(100, 'square', 0.1); 
                VFX.shake(); 
                if(e) VFX.spark(e.clientX, e.clientY); // Chispas donde haces clic

                if(this.integrity >= 100) this.success(); 
                
                const heart = document.getElementById('heart-reactor');
                heart.style.transform = "scale(1.5) rotate(5deg)";
                setTimeout(() => heart.style.transform = "scale(1) rotate(0deg)", 80);
            },

            decayLoop() {
                if(!this.active) return;
                
                this.integrity -= this.decayRate;
                
                const bar = document.getElementById('integrity-fill');
                bar.style.width = Math.max(0, Math.min(100, this.integrity)) + "%";
                
                if(this.integrity < 30) bar.style.background = "#fff";
                else if (this.integrity > 80) bar.style.background = "#fff"; // Flash blanco al estar lleno
                else bar.style.background = "linear-gradient(90deg, #ff003c, #ffcc00)";

                if(this.integrity >= 100) {
                    this.success();
                    return; 
                }

                if(this.integrity <= 0) {
                    this.integrity = 20; 
                    SoundSynth.tone(50, 'sawtooth', 0.5); 
                }
                
                requestAnimationFrame(() => this.decayLoop());
            },

            spawnGlitches() {
                if(!this.active) return;
                const phrases = ["ERROR", "VÍNCULO", "FUEGO", "DATA", "CORAZÓN", "SISTEMA"];
                
                const el = document.createElement('div');
                el.className = 'glitch-text-node';
                el.innerText = phrases[Math.floor(Math.random()*phrases.length)];
                el.style.left = Math.random() * 80 + 10 + "%";
                el.style.top = Math.random() * 80 + 10 + "%";
                el.style.transform = `rotate(${Math.random()*20 - 10}deg)`;
                
                document.getElementById('critical-failure-layer').appendChild(el);
                setTimeout(() => el.remove(), 500);
                setTimeout(() => this.spawnGlitches(), 400); // Más glitches más rápido
            },

            success() {
                this.active = false;
                // Efecto Visual de Éxito
                const bar = document.getElementById('integrity-fill');
                bar.style.width = "100%";
                bar.style.background = "var(--soul-gold)";
                bar.style.boxShadow = "0 0 50px var(--soul-gold)";

                this.showButton("SINCRONIZACIÓN COMPLETA - CONTINUAR");
            },

            showButton(text) {
                const btn = document.getElementById('continue-btn');
                btn.style.display = 'block';
                btn.innerText = text;
                
                // Ocultar corazón para limpiar pantalla
                document.getElementById('heart-reactor').style.display = 'none';
            }
        };
    </script>
    <script type="module">
        import { registrarPaso } from './telemetry.js';
        registrarPaso("Eco III : Titan Edition");
    </script>
