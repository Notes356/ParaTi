    <style>
        /* =============================================================================
           CORE SYSTEM: VARIABLES & CONFIGURATION
           ============================================================================= */
        :root {
            --void-deep: #020205;
            --void-light: #0b0b2b;
            --neon-cyan: #00f3ff;
            --neon-magenta: #bc13fe;
            --neon-plasma: #ffffff;
            --system-error: #ff0055;
            
            --ui-glass: rgba(10, 15, 30, 0.65);
            --ui-border: rgba(255, 255, 255, 0.15);
            
            --font-header: 'Press Start 2P', cursive;
            --font-body: 'VT323', monospace;
            
            --ease-elastic: cubic-bezier(0.68, -0.55, 0.265, 1.55);
            
            --z-bg-deep: 0;
            --z-bg-mid: 10;
            --z-world: 50;
            --z-player: 60;
            --z-ui: 100;
            --z-overlay: 999;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--void-deep);
            font-family: var(--font-header); color: var(--neon-plasma);
            user-select: none; cursor: crosshair;
        }

        /* --- FX LAYER --- */
        .fx-layer { position: fixed; inset: 0; z-index: var(--z-ui); pointer-events: none; mix-blend-mode: overlay; }
        .scanlines {
            position: absolute; inset: 0;
            background: repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, rgba(0,0,0,0.3) 3px, rgba(0,0,0,0.3) 4px);
            opacity: 0.7; z-index: 2;
        }
        .vignette {
            position: absolute; inset: 0;
            background: radial-gradient(circle at center, transparent 50%, #000 120%); z-index: 3;
        }
        .noise-grain {
            position: absolute; inset: 0; opacity: 0.15; z-index: 1;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            animation: grainShift 0.5s steps(3) infinite;
        }
        .chromatic-aberration {
            position: absolute; inset: 0;
            box-shadow: inset 0 0 50px rgba(255,0,0,0.1), inset 0 0 50px rgba(0,0,255,0.1);
            mix-blend-mode: screen; z-index: 4;
        }
        .flash-bang {
            position: fixed; inset: 0; background: white; opacity: 0;
            transition: opacity 0.1s ease-out; z-index: 1000; pointer-events: none;
        }

        /* --- START SCREEN --- */
        .system-overlay {
            position: fixed; inset: 0; z-index: var(--z-overlay);
            background: #000; display: flex; justify-content: center; align-items: center;
            transition: opacity 0.8s ease-in-out, visibility 0.8s;
        }
        .intro-terminal {
            text-align: center; border: 1px solid var(--neon-cyan);
            padding: 40px; background: rgba(0, 20, 40, 0.9);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1); max-width: 90%;
        }
        .glitch-title {
            font-size: clamp(30px, 8vw, 60px); color: var(--neon-plasma);
            text-shadow: 3px 3px 0 var(--neon-magenta), -3px -3px 0 var(--neon-cyan);
            animation: glitchMain 3s infinite alternate;
        }
        .sub-title {
            font-family: var(--font-body); font-size: 1.5rem; letter-spacing: 0.3em;
            color: #888; margin-bottom: 30px;
        }
        .terminal-loader {
            font-family: var(--font-body); text-align: left; margin: 20px 0;
            color: var(--neon-cyan); font-size: 1.2rem;
        }
        .cmd-line { display: block; opacity: 0; animation: typeLine 0.5s forwards; }
        .cmd-line:nth-child(2) { animation-delay: 0.8s; }
        
        .blink-cta {
            background: transparent; border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan); padding: 15px 30px;
            font-family: var(--font-header); font-size: 14px; cursor: pointer;
            margin-top: 30px; transition: all 0.3s; animation: pulseGlow 1.5s infinite;
        }
        .blink-cta:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 20px var(--neon-cyan); }

        /* --- VIEWPORT --- */
        #game-viewport {
            position: absolute; inset: 0; overflow: hidden;
            background: linear-gradient(to bottom, #020205 0%, #050510 40%, #1a1a4a 80%, #2b3a60 100%);
        }
        .parallax-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; will-change: transform; }
        
        #bg-layer-deep::after {
            content: " "; position: absolute; width: 2px; height: 2px; background: transparent;
            box-shadow: 10vw 10vh #fff, 20vw 50vh #fff, 50vw 20vh #fff, 80vw 80vh #fff, 15vw 90vh #fff, 90vw 10vh #fff;
            opacity: 0.8;
        }
        #bg-layer-mid {
            background-image: linear-gradient(to bottom, transparent 70%, #050510 100%);
            z-index: var(--z-bg-mid);
        }

        /* --- WORLD TRACK --- */
        #world-track {
            position: absolute; bottom: 0; left: 0; width: 4000px; height: 100%;
            z-index: var(--z-world); transform-style: preserve-3d;
        }
        .floor-grid {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 250px;
            background: linear-gradient(transparent 20%, rgba(0,243,255,0.1) 21%, transparent 22%),
                        linear-gradient(90deg, transparent 20%, rgba(0,243,255,0.05) 21%, transparent 22%);
            background-size: 100px 40px; transform-origin: bottom;
            transform: perspective(500px) rotateX(60deg) scale(2); pointer-events: none;
        }

        /* --- ENTITIES --- */
        .interactive-zone {
            position: absolute; bottom: 160px; width: 70px; height: 100px;
            display: flex; justify-content: center; align-items: center;
            animation: floatEntity 4s ease-in-out infinite;
        }
        .interaction-hint {
            position: absolute; top: -60px; color: var(--neon-cyan);
            font-size: 24px; text-shadow: 0 0 10px var(--neon-cyan);
            animation: bounce 0.8s infinite alternate; display: none;
        }
        .entity-visual.card-container { width: 60px; height: 90px; perspective: 600px; }
        .card-inner {
            position: relative; width: 100%; height: 100%; text-align: center;
            transition: transform 0.8s; transform-style: preserve-3d; transform: rotateY(0deg);
        }
        .interactive-zone.active .card-inner { transform: rotateY(180deg); }
        .card-face {
            position: absolute; inset: 0; backface-visibility: hidden;
            border-radius: 8px; border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0,243,255,0.3);
        }
        .card-front {
            background: rgba(5,5,10,0.9);
            background-image: linear-gradient(135deg, transparent 40%, rgba(0,243,255,0.4) 50%, transparent 60%);
        }
        .card-back {
            background: #fff; transform: rotateY(180deg);
            display: flex; justify-content: center; align-items: center;
            font-size: 30px; color: var(--neon-magenta);
        }
        .energy-pillar {
            position: absolute; bottom: -80px; left: 50%; width: 20px; height: 100px;
            transform: translateX(-50%); background: linear-gradient(to bottom, var(--neon-cyan), transparent);
            opacity: 0.3; filter: blur(10px); z-index: -1;
        }

        /* NPC TARGET */
        .npc-target { bottom: 130px; }
        .sacred-geometry-aura {
            position: absolute; top: 50%; left: 50%; width: 140px; height: 140px;
            transform: translate(-50%, -50%); border: 1px dashed rgba(255,255,255,0.3);
            border-radius: 50%; animation: spinAura 10s linear infinite;
        }
        #npc-sprite { width: 90px; filter: drop-shadow(0 0 15px white); image-rendering: pixelated; }

        /* PLAYER */
        #player-container {
            position: absolute; bottom: 120px; left: 20%; width: 130px; height: 130px;
            z-index: var(--z-player); transition: transform 0.1s linear;
        }
        #player-sprite {
            width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated;
            filter: drop-shadow(0 0 5px rgba(0,243,255,0.5));
        }
        .player-shadow {
            position: absolute; bottom: 5px; left: 35%; width: 30%; height: 10px;
            background: rgba(0,0,0,0.6); border-radius: 50%; filter: blur(4px);
            animation: shadowPulse 1s infinite alternate;
        }
        .anim-walking #player-sprite { animation: walkBob 0.3s infinite alternate ease-in-out; }

        /* --- HUD --- */
        #ui-hud {
            position: fixed; inset: 0; pointer-events: none; z-index: var(--z-ui);
            padding: 20px; display: flex; flex-direction: column; justify-content: space-between;
        }
        .hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .hud-module {
            background: var(--ui-glass); backdrop-filter: blur(8px);
            border: 1px solid var(--ui-border); padding: 10px 15px; border-radius: 4px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .location-data { border-left: 3px solid var(--neon-cyan); }
        .collection-data { border-right: 3px solid var(--neon-magenta); text-align: right; }
        .label { display: block; font-size: 10px; color: #aaa; margin-bottom: 4px; }
        .value { font-size: 14px; color: var(--neon-plasma); }
        .progress-bar-container {
            width: 150px; height: 6px; background: #222; margin-top: 5px;
            position: relative; overflow: hidden;
        }
        #progress-fill {
            height: 100%; background: var(--neon-magenta); box-shadow: 0 0 10px var(--neon-magenta);
            transition: width 0.4s var(--ease-elastic);
        }

        /* Action Button */
        #interaction-layer {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            pointer-events: auto;
        }
        .action-trigger {
            background: rgba(0,0,0,0.8); border: none; cursor: pointer; position: relative;
            padding: 20px 40px; transition: transform 0.2s;
        }
        .btn-text {
            font-family: var(--font-header); color: var(--neon-cyan); font-size: 16px;
            position: relative; z-index: 2; text-shadow: 0 0 5px var(--neon-cyan);
        }
        .btn-border {
            position: absolute; inset: 0; border: 2px solid var(--neon-cyan);
            clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%);
        }
        .action-trigger:active { transform: scale(0.95); }
        .action-trigger.hidden { display: none; }

        /* Dialogue Box */
        .dialogue-system {
            pointer-events: auto; width: 95%; max-width: 600px;
            margin: 0 auto 100px auto; perspective: 1000px;
        }
        .dialogue-glass-panel {
            background: rgba(5,5,10,0.95); border: 1px solid #444;
            border-top: 3px solid var(--neon-magenta); padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); transform: rotateX(10deg);
            animation: popIn 0.3s var(--ease-elastic);
        }
        .dialogue-header {
            display: flex; justify-content: space-between; border-bottom: 1px solid #333;
            padding-bottom: 10px; margin-bottom: 10px; color: var(--neon-magenta); font-size: 12px;
        }
        .dialogue-content p {
            font-family: var(--font-body); font-size: 24px; line-height: 1.2; margin: 0; min-height: 80px;
        }
        .dialogue-footer { text-align: right; font-size: 12px; color: #666; margin-top: 10px; }

        /* Controls */
        .touch-controls {
            position: absolute; bottom: 30px; width: 100%;
            display: flex; justify-content: space-between; padding: 0 20px; pointer-events: auto;
        }
        .d-pad-btn {
            width: 80px; height: 80px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; fill: white;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(4px); transition: background 0.1s;
        }
        .d-pad-btn svg { width: 40px; height: 40px; opacity: 0.8; }
        .d-pad-btn:active { background: rgba(0,243,255,0.2); }

        /* Ending */
        #ending-overlay {
            position: fixed; inset: 0; z-index: 2000; background: #000;
            display: flex; justify-content: center; align-items: center; text-align: center;
        }
        .heart-pulse { font-size: 80px; color: var(--system-error); animation: heartBeat 1.2s infinite; }
        .fade-in-text { opacity: 0; animation: fadeIn 3s forwards 1s; }
        .delay-1 { animation-delay: 3s; font-family: var(--font-body); color: #888; font-size: 20px; }
        .hidden { display: none !important; }
        
        /* Keyframes */
        @keyframes glitchMain {
            0% { text-shadow: 3px 3px 0 var(--neon-magenta), -3px -3px 0 var(--neon-cyan); }
            20% { text-shadow: -3px 3px 0 var(--neon-magenta), 3px -3px 0 var(--neon-cyan); transform: translate(2px, -2px); }
            21% { transform: translate(0, 0); }
            100% { text-shadow: 3px 3px 0 var(--neon-magenta), -3px -3px 0 var(--neon-cyan); }
        }
        @keyframes typeLine { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes floatEntity { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }
        @keyframes spinAura { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes walkBob { from { transform: translateY(0); } to { transform: translateY(-8px); } }
        @keyframes shadowPulse { from { transform: scale(1); opacity: 0.6; } to { transform: scale(0.8); opacity: 0.3; } }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }
        @keyframes popIn { from { transform: scale(0.8) rotateX(10deg); opacity: 0; } to { transform: scale(1) rotateX(10deg); opacity: 1; } }
        @keyframes heartBeat { 0% { transform: scale(1); } 15% { transform: scale(1.3); } 30% { transform: scale(1); } 45% { transform: scale(1.15); } 60% { transform: scale(1); } }
        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes grainShift { 0%, 100% { transform: translate(0,0); } 10% { transform: translate(-5%, -10%); } 20% { transform: translate(-15%, 5%); } 30% { transform: translate(5%, -25%); } }
    </style>
</head>

    <script>
        const CONFIG = {
            physics: { maxSpeed: 8, acceleration: 0.8, friction: 0.88, worldWidth: 4000 },
            camera: { smooth: 0.1, deadzone: 0.3 },
            audio: { typeSpeed: 40, musicVol: 0.4 }
        };

        // --- AUDIO SYSTEM ---
        class AudioSystem {
            constructor() {
                this.ctx = null;
                this.bgNode = null;
                this.filterNode = null;
                this.gainNode = null;
                this.isInitialized = false;
            }

            init() {
                if (this.isInitialized) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
                
                const audioEl = document.getElementById('bg-music');
                this.bgNode = this.ctx.createMediaElementSource(audioEl);
                this.filterNode = this.ctx.createBiquadFilter();
                this.filterNode.type = 'lowpass';
                this.filterNode.frequency.value = 20000;
                
                this.gainNode = this.ctx.createGain();
                this.gainNode.gain.value = CONFIG.audio.musicVol;

                this.bgNode.connect(this.filterNode);
                this.filterNode.connect(this.gainNode);
                this.gainNode.connect(this.ctx.destination);
                
                audioEl.play().catch(e => console.log("Audio waiting interaction..."));
                this.isInitialized = true;
            }

            dampenMusic(active) {
                if (!this.ctx) return;
                const targetFreq = active ? 400 : 20000;
                const now = this.ctx.currentTime;
                this.filterNode.frequency.cancelScheduledValues(now);
                this.filterNode.frequency.exponentialRampToValueAtTime(targetFreq, now + 0.5);
            }

            playBlip() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const freq = 600 + (Math.random() * 200);
                osc.type = 'square';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.06);
            }

            playChime() {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                [440, 554, 659].forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.1, now + 0.1 + (i*0.1));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(now + 2.5);
                });
            }
        }

        const MEMORIES = [
            { id: "monolith-0", title: "VERDAD I: EL MIEDO", text: "Durante mucho tiempo, construí muros. No porque no te quisiera, sino porque me aterraba la idea de que alguien viera mi desorden y decidiera quedarse. Tu paciencia fue el martillo que derribó esos muros." },
            { id: "monolith-1", title: "VERDAD II: EL TIEMPO", text: "Sé que hemos perdido momentos. Sé que la distancia duele. Pero cada segundo lejos de ti me sirvió para entender una sola cosa: No quiero pasar mi tiempo con nadie más." },
            { id: "monolith-2", title: "VERDAD III: LA CERTEZA", text: "No sé qué nos depara el futuro. El código de la vida es impredecible. Pero si hay una verdad inmutable en mi historia, sos vos." }
        ];

        // --- INPUT ---
        class InputHandler {
            constructor() {
                this.direction = 0;
                this.keys = { left: false, right: false };
                this.setupKeyboard();
                this.setupTouch();
            }
            setupKeyboard() {
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowLeft' || e.key === 'a') this.keys.left = true;
                    if (e.key === 'ArrowRight' || e.key === 'd') this.keys.right = true;
                    this.updateDirection();
                });
                document.addEventListener('keyup', (e) => {
                    if (e.key === 'ArrowLeft' || e.key === 'a') this.keys.left = false;
                    if (e.key === 'ArrowRight' || e.key === 'd') this.keys.right = false;
                    this.updateDirection();
                });
            }
            setupTouch() {
                const btnL = document.getElementById('btn-left');
                const btnR = document.getElementById('btn-right');
                const start = (dir) => { this.direction = dir; };
                const end = () => { this.direction = 0; };
                btnL.addEventListener('touchstart', (e) => { e.preventDefault(); start(-1); });
                btnR.addEventListener('touchstart', (e) => { e.preventDefault(); start(1); });
                btnL.addEventListener('touchend', (e) => { e.preventDefault(); end(); });
                btnR.addEventListener('touchend', (e) => { e.preventDefault(); end(); });
            }
            updateDirection() {
                if (this.keys.left && !this.keys.right) this.direction = -1;
                else if (this.keys.right && !this.keys.left) this.direction = 1;
                else this.direction = 0;
            }
        }

        // --- VFX ---
        class VFX {
            constructor() {
                this.viewport = document.getElementById('game-viewport');
            }
            textGlitch(element, originalText) {
                const chars = '!@#$%^&*()_+-=[]{}|;:,.<>?';
                let iterations = 0;
                const interval = setInterval(() => {
                    element.innerText = originalText.split('').map((letter, index) => {
                        if (index < iterations) return originalText[index];
                        return chars[Math.floor(Math.random() * chars.length)];
                    }).join('');
                    if (iterations >= originalText.length) clearInterval(interval);
                    iterations += 1 / 3;
                }, 30);
            }
        }

        // --- GAME ENGINE ---
        class GameEngine {
            constructor() {
                this.audio = new AudioSystem();
                this.input = new InputHandler();
                this.vfx = new VFX();
                this.state = 'BOOT';
                this.lastTime = 0;
                this.collected = 0;
                this.playerX = 100;
                this.velocity = 0;
                this.dom = {
                    player: document.getElementById('player-sprite'),
                    playerContainer: document.getElementById('player-container'),
                    track: document.getElementById('world-track'),
                    bgDeep: document.getElementById('bg-layer-deep'),
                    bgMid: document.getElementById('bg-layer-mid'),
                    hudCount: document.getElementById('fragment-count'),
                    hudBar: document.getElementById('progress-fill'),
                    actionBtn: document.getElementById('action-btn'),
                    dialogBox: document.getElementById('rpg-dialogue-box'),
                    dialogTitle: document.getElementById('dialogue-title'),
                    dialogText: document.getElementById('dialogue-text'),
                    zones: document.querySelectorAll('.interactive-zone')
                };
                this.currentZone = null;
            }

            init() {
                const startBtn = document.getElementById('btn-start');
                if(startBtn) {
                    startBtn.addEventListener('click', () => this.bootSequence());
                } else {
                    console.error("Button not found, retrying...");
                    setTimeout(() => this.init(), 100);
                }
            }

            bootSequence() {
                this.audio.init();
                const startScreen = document.getElementById('start-screen');
                startScreen.style.opacity = 0;
                document.body.dataset.state = "running";
                setTimeout(() => {
                    startScreen.style.display = 'none';
                    this.state = 'PLAY';
                    this.trackEntry();
                    this.gameLoop(0);
                }, 1000);
            }

            trackEntry() {
                // ESPACIO PARA TELEMETRÍA MANUAL
                console.log("Juego Iniciado");
            }

            gameLoop(timestamp) {
                const dt = timestamp - this.lastTime;
                this.lastTime = timestamp;
                if (this.state === 'PLAY') {
                    this.updatePhysics(dt);
                    this.updateCamera();
                    this.checkCollisions();
                    this.render();
                }
                requestAnimationFrame((t) => this.gameLoop(t));
            }

            updatePhysics(dt) {
                if (this.input.direction !== 0) {
                    this.velocity += this.input.direction * CONFIG.physics.acceleration;
                } else {
                    this.velocity *= CONFIG.physics.friction;
                }
                const max = CONFIG.physics.maxSpeed;
                if (this.velocity > max) this.velocity = max;
                if (this.velocity < -max) this.velocity = -max;
                if (Math.abs(this.velocity) < 0.1) this.velocity = 0;
                this.playerX += this.velocity;
                if (this.playerX < 50) { this.playerX = 50; this.velocity = 0; }
                if (this.playerX > CONFIG.physics.worldWidth - 150) { 
                    this.playerX = CONFIG.physics.worldWidth - 150; 
                    this.velocity = 0; 
                }
            }

            updateCamera() {
                const viewportW = window.innerWidth;
                let targetCamX = -(this.playerX - (viewportW * 0.3));
                if (targetCamX > 0) targetCamX = 0;
                const minCam = -(CONFIG.physics.worldWidth - viewportW);
                if (targetCamX < minCam) targetCamX = minCam;
                this.dom.track.style.transform = `translate3d(${targetCamX}px, 0, 0)`;
                this.dom.bgDeep.style.transform = `translate3d(${targetCamX * 0.05}px, 0, 0)`;
                this.dom.bgMid.style.transform = `translate3d(${targetCamX * 0.2}px, 0, 0)`;
            }

            checkCollisions() {
                let nearestZone = null;
                const detectionRadius = 120;
                this.dom.zones.forEach(zone => {
                    const zoneX = parseInt(zone.style.left);
                    const dist = Math.abs(this.playerX - zoneX);
                    if (dist < 400 && zone.dataset.type === 'memory') {
                        const angle = (this.playerX - zoneX) * 0.1; 
                        const clampedAngle = Math.max(-60, Math.min(60, angle));
                        const inner = zone.querySelector('.card-inner');
                        if (inner) {
                            const baseRot = zone.classList.contains('read') ? 180 : 0;
                            inner.style.transform = `rotateY(${baseRot + clampedAngle}deg)`;
                        }
                    }
                    if (dist < detectionRadius) {
                        nearestZone = zone;
                    }
                });
                if (nearestZone && nearestZone !== this.currentZone) {
                    this.currentZone = nearestZone;
                    this.showInteractionButton(true, nearestZone.dataset.type);
                    const hint = nearestZone.querySelector('.interaction-hint');
                    if(hint) hint.style.display = 'block';
                } else if (!nearestZone && this.currentZone) {
                    const hint = this.currentZone.querySelector('.interaction-hint');
                    if(hint) hint.style.display = 'none';
                    this.currentZone = null;
                    this.showInteractionButton(false);
                }
            }

            showInteractionButton(show, type) {
                const btn = this.dom.actionBtn;
                if (show) {
                    btn.classList.remove('hidden');
                    const textSpan = btn.querySelector('.btn-text');
                    textSpan.innerText = (type === 'end') ? "SINCRONIZAR" : "LEER DATOS";
                    const newBtn = btn.cloneNode(true);
                    btn.parentNode.replaceChild(newBtn, btn);
                    this.dom.actionBtn = newBtn;
                    this.dom.actionBtn.addEventListener('click', () => this.triggerInteraction());
                } else {
                    btn.classList.add('hidden');
                }
            }

            render() {
                if (Math.abs(this.velocity) > 0.5) {
                    this.dom.playerContainer.classList.add('anim-walking');
                    const scaleX = this.velocity < 0 ? -1 : 1;
                    this.dom.player.style.transform = `scaleX(${scaleX})`;
                } else {
                    this.dom.playerContainer.classList.remove('anim-walking');
                }
            }

            triggerInteraction() {
                if (!this.currentZone) return;
                this.state = 'DIALOGUE';
                this.velocity = 0;
                this.dom.playerContainer.classList.remove('anim-walking');
                this.dom.actionBtn.classList.add('hidden');
                this.audio.dampenMusic(true);
                const type = this.currentZone.dataset.type;
                if (type === 'end') {
                    this.triggerEnding();
                } else {
                    const id = this.currentZone.id;
                    const data = MEMORIES.find(m => m.id === id);
                    this.currentZone.classList.add('read');
                    const inner = this.currentZone.querySelector('.card-inner');
                    if(inner) inner.style.transform = 'rotateY(180deg)';
                    this.runDialogue(data.title, data.text);
                    if (!this.currentZone.dataset.collected) {
                        this.currentZone.dataset.collected = "true";
                        this.updateProgress();
                    }
                }
            }

            updateProgress() {
                this.collected++;
                this.dom.hudCount.innerText = this.collected;
                const pct = (this.collected / 3) * 100;
                this.dom.hudBar.style.width = `${pct}%`;
                this.audio.playChime();
            }

            runDialogue(title, text) {
                const box = this.dom.dialogBox;
                box.classList.remove('hidden');
                this.dom.dialogTitle.innerText = "";
                this.vfx.textGlitch(this.dom.dialogTitle, title);
                const content = this.dom.dialogText;
                content.innerHTML = "";
                let i = 0;
                const interval = setInterval(() => {
                    content.innerHTML += text.charAt(i);
                    if (i % 2 === 0) this.audio.playBlip();
                    i++;
                    if (i >= text.length) {
                        clearInterval(interval);
                        this.waitForExit();
                    }
                }, CONFIG.audio.typeSpeed);
            }

            waitForExit() {
                const box = this.dom.dialogBox;
                const closeHandler = () => {
                    box.classList.add('hidden');
                    this.state = 'PLAY';
                    this.audio.dampenMusic(false);
                    box.removeEventListener('click', closeHandler);
                };
                setTimeout(() => {
                    box.addEventListener('click', closeHandler);
                }, 500);
            }

            triggerEnding() {
                const overlay = document.getElementById('ending-overlay');
                overlay.classList.remove('hidden');
                const fadeAudio = setInterval(() => {
                    if (this.audio.gainNode.gain.value > 0.01) {
                        this.audio.gainNode.gain.value -= 0.05;
                    } else {
                        clearInterval(fadeAudio);
                        if(this.audio.ctx) this.audio.ctx.suspend();
                    }
                }, 200);

                // SALTO DE PÁGINA
                setTimeout(() => {
                    window.location.href = 'EcoVI.html';
                }, 5000);
            }
        }

        // Start safely
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                const game = new GameEngine();
                game.init();
            });
        } else {
            const game = new GameEngine();
            game.init();
        }
 </script>
