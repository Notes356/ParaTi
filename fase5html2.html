<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050510">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>ECO V: Event Horizon</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    
    <link rel="preload" as="image" href="https://raw.githubusercontent.com/Notes356/NotasParsMIRO/b32ef0a23b35cffc8d5362ac0476cdb1bed418de/Fase4/Picsart_26-02-03_11-41-34-090.webp">
    <link rel="preload" as="image" href="https://raw.githubusercontent.com/Notes356/NotasParsMIRO/43358b6d3df23269b45034ecec712fabccb46879/Fase5/Acto2/yo%20normal.webp">

    <link rel="stylesheet" href="fase5css.css">
</head>
<body data-state="booting">

    <section id="start-screen" class="system-overlay">
        <div class="intro-terminal">
            <h1 class="glitch-title" data-text="Eco V">Eco V</h1>
            <div class="terminal-loader">
                <span class="cmd-line">> INICIANDO PROTOCOLO DE SINCRONIZACIÓN...</span>
                <span class="cmd-line">> CARGANDO MEMORIAS... [OK]</span>
            </div>
            <h2 class="sub-title">LA ÚLTIMA VERDAD</h2>
            <button id="btn-start" class="blink-cta">[ TOCAR PARA CONECTAR ]</button>
        </div>
    </section>

    <div class="fx-layer pointer-events-none">
        <div class="vignette"></div>
        <div class="scanlines"></div>
        <div class="noise-grain"></div>
        <div class="chromatic-aberration"></div>
        <div class="flash-bang"></div>
    </div>

    <main id="game-viewport">
        
        <div id="bg-layer-deep" class="parallax-layer" data-speed="0.1"></div>
        
        <div id="bg-layer-mid" class="parallax-layer" data-speed="0.5"></div>

        <div id="world-track">
            
            <div class="floor-grid"></div>

            <div class="interactive-zone monolith" id="monolith-0" style="left: 800px;" data-type="memory">
                <div class="interaction-hint">!</div>
                <div class="entity-visual card-container">
                    <div class="card-inner">
                        <div class="card-face card-front"></div>
                        <div class="card-face card-back">❤</div>
                    </div>
                    <div class="energy-pillar"></div>
                </div>
            </div>

            <div class="interactive-zone monolith" id="monolith-1" style="left: 1800px;" data-type="memory">
                <div class="interaction-hint">!</div>
                <div class="entity-visual card-container">
                    <div class="card-inner">
                        <div class="card-face card-front"></div>
                        <div class="card-face card-back">❤</div>
                    </div>
                    <div class="energy-pillar"></div>
                </div>
            </div>

            <div class="interactive-zone monolith" id="monolith-2" style="left: 2800px;" data-type="memory">
                <div class="interaction-hint">!</div>
                <div class="entity-visual card-container">
                    <div class="card-inner">
                        <div class="card-face card-front"></div>
                        <div class="card-face card-back">❤</div>
                    </div>
                    <div class="energy-pillar"></div>
                </div>
            </div>

            <div class="interactive-zone npc-target" id="target-npc-container" style="left: 3600px;" data-type="end">
                <div class="entity-visual">
                    <div class="sacred-geometry-aura"></div>
                    <img id="npc-sprite" src="https://raw.githubusercontent.com/Notes356/NotasParsMIRO/43358b6d3df23269b45034ecec712fabccb46879/Fase5/Acto2/yo%20normal.webp" alt="Destino">
                </div>
            </div>
        </div>

        <div id="player-container">
            <div class="player-aura"></div>
            <img id="player-sprite" src="https://raw.githubusercontent.com/Notes356/NotasParsMIRO/b32ef0a23b35cffc8d5362ac0476cdb1bed418de/Fase4/Picsart_26-02-03_11-41-34-090.webp" alt="Jugador">
            <div class="player-shadow"></div>
        </div>

        <div id="fg-fog-layer" class="parallax-layer"></div>
    </main>

    <aside id="ui-hud">
        <header class="hud-top">
            <div class="hud-module location-data">
                <span class="label">UBICACIÓN</span>
                <span class="value glitch-text-small">EL VACÍO</span>
            </div>
            
            <div class="hud-module collection-data">
                <div class="fragment-tracker">
                    <span class="label">MEMORIAS</span>
                    <span class="counter"><span id="fragment-count">0</span>/3</span>
                </div>
                <div class="progress-bar-container">
                    <div id="progress-fill" style="width: 0%;"></div>
                </div>
            </div>
        </header>

        <div id="interaction-layer">
            <button id="action-btn" class="action-trigger hidden">
                <span class="btn-text">INICIAR LECTURA</span>
                <span class="btn-border"></span>
            </button>
        </div>

        <article id="rpg-dialogue-box" class="dialogue-system hidden">
            <div class="dialogue-glass-panel">
                <header class="dialogue-header">
                    <span id="dialogue-title">SISTEMA</span>
                    <div class="audio-wave-visualizer"></div>
                </header>
                <div class="dialogue-content">
                    <p id="dialogue-text">...</p>
                </div>
                <footer class="dialogue-footer">
                    <span class="blink-arrow">▼</span> TOCAR PARA CONTINUAR
                </footer>
            </div>
        </article>

        <nav class="touch-controls">
            <button id="btn-left" class="d-pad-btn" aria-label="Mover Izquierda">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <button id="btn-right" class="d-pad-btn" aria-label="Mover Derecha">
                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </button>
        </nav>
    </aside>

    <section id="ending-overlay" class="hidden">
        <div class="cinematic-content">
            <div class="heart-pulse">❤</div>
            <h2 class="fade-in-text">CONEXIÓN RESTABLECIDA</h2>
            <p class="fade-in-text delay-1">Fin del Juego. Inicio de la Vida.</p>
        </div>
    </section>

    <div id="audio-system">
        <audio id="bg-music" loop preload="auto">
            <source src="https://raw.githubusercontent.com/Notes356/NotasParsMIRO/9dadd84bb5327d566f58dd3f460590427c42e628/Faces%206%20ECO5/guilhermebernardes-near-danger-10375.ogg" type="audio/ogg">
        </audio>
    </div>

    <script type="module" src="fase5scrpit.js" defer></script>
    <script type="module">
        import { registrarPaso } from './telemetry.js';
        // Check defensivo por si telemetry falla
        if (typeof registrarPaso === 'function') {
            registrarPaso("Eco V: El Horizonte de Eventos");
        }
    </script>

</body>
</html>
